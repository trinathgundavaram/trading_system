  } catch (e) { toast(`Couldn't reach the server: ${e.message}`, "error"); }
}

// Manual REAL sell (2026-07-24, Trinath's explicit choice): places an
// ACTUAL Robinhood market order via /api/real/sell (engine/live_trader.py's
// order path, Agentic account) - real money, cannot be undone. Requires
// re-typing the exact ticker as confirmation (more friction than a plain
// confirm() dialog, on purpose) on top of the auth token every write
// endpoint already needs.
async function realSell(ticker) {
  const typed = window.prompt(
    `This places a REAL Robinhood market SELL order for your entire ${ticker} position ` +
    `(Agentic account, config.yaml account.robinhood_account_number). This is real money ` +
    `and cannot be undone.\n\nType ${ticker} to confirm:`);
  if (typed === null) return;  // cancelled
  if (typed.trim().toUpperCase() !== ticker.toUpperCase()) {
    toast("Ticker didn't match - sell cancelled, nothing was sent.", "alert");
    return;
  }
  const token = await getToken();
  if (!token) return;
  try {
    const r = await fetch("/api/real/sell", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Auth-Token": token },
      body: JSON.stringify({ ticker, confirm: typed.trim() }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      toast(body.detail || `Sell failed (${r.status})`, "error");
      if (r.status === 403) localStorage.removeItem(AUTH_TOKEN_KEY);
      return;
    }
    toast(`${ticker} SOLD (real) @ $${body.exit_price?.toFixed(2)} — P&L ${(body.pnl||0) >= 0 ? '+' : ''}$${body.pnl?.toFixed(2)} (${body.pnl_pct?.toFixed(2)}%)`, "success");

}

let _portfolioRefreshTimer = null;
let _pfStructure = "";  // fingerprint of what's rendered: tickers + trade count

function _pfFingerprint(summary, trades) {
  const t = (summary.open_positions || []).map(p => p.ticker).sort().join(",");
  return `${t}|${trades.length}|${summary.seeded}`;
}

async function _fetchPortfolio() {
  // live=1: fresh quotes for open positions (provider chain, cached
  // briefly) so the tab tracks the market between scan cycles.
  const [summary, trades, history] = await Promise.all([
    (await fetch("/api/paper/summary?live=1")).json(),
    (await fetch("/api/paper/trades?limit=300")).json(),
    (await fetch("/api/paper/equity_history?limit=500")).json(),
  ]);
  return { summary, trades, history };
}

// In-place refresh (2026-07-16, Akhil's ask): patch ONLY the numbers, row
// cells, and the equity SVG - no innerHTML rebuild of the whole tab, so no
// flicker, no lost scroll position, no re-fetched layout. Falls back to a
// full render only when the STRUCTURE changed (position opened/closed or a
// new ledger row) since that needs new DOM anyway.
function _setVal(id, text, pnlValue) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  if (pnlValue !== undefined) {
    el.classList.remove("positive", "negative");
    el.classList.add((pnlValue || 0) >= 0 ? "positive" : "negative");
  }
}

function _setCell(ticker, field, html, pnlValue) {
  const el = document.querySelector(`[data-pf="${ticker}:${field}"]`);
  if (!el) return;
  el.innerHTML = html;
  if (pnlValue !== undefined) {
    el.classList.remove("positive", "negative");
    el.classList.add((pnlValue || 0) >= 0 ? "positive" : "negative");
  }
}

async function _refreshPortfolioInPlace() {
  if (currentTab !== "portfolio") return;
  let data;
  try { data = await _fetchPortfolio(); } catch (e) { return; }  // transient - keep old numbers
  const { summary, trades, history } = data;
  if (_pfFingerprint(summary, trades) !== _pfStructure) {
    // a position opened/closed or a trade landed - rebuild once
    renderPortfolioTab(document.getElementById("content"), data);
    return;
  }
  const ret = summary.total_return_pct || 0;
  _setVal("pf-total", fmtUSD(summary.total_value));
  _setVal("pf-return", `${ret >= 0 ? '+' : ''}${ret.toFixed(2)}% vs $${(summary.starting_cash || 0).toFixed(0)} start`, ret);
  _setVal("pf-cash", fmtUSD(summary.cash));
  _setVal("pf-invested", fmtUSD(summary.invested_cost));
  _setVal("pf-unreal", fmtUSD(summary.unrealized_pnl), summary.unrealized_pnl);
  _setVal("pf-realized", fmtUSD(summary.realized_pnl), summary.realized_pnl);
  _setVal("pf-mktval", fmtUSD(summary.market_value));
  for (const p of (summary.open_positions || [])) {
    const upnl = p.unrealized_pnl, upct = (p.cost && upnl != null) ? upnl / p.cost * 100 : null;
    _setCell(p.ticker, "now", p.current_price ? '$' + p.current_price.toFixed(2) : '—');
    _setCell(p.ticker, "value", fmtUSD(p.market_value));
    _setCell(p.ticker, "stop", p.stop_price ? '$' + p.stop_price.toFixed(2) : '—');
    _setCell(p.ticker, "target", p.target_price ? '$' + p.target_price.toFixed(2) : '—');
    _setCell(p.ticker, "upnl",
      `${fmtUSD(upnl)}${upct != null ? ` <span style="font-size:10px;">(${upct >= 0 ? '+' : ''}${upct.toFixed(1)}%)</span>` : ''}`, upnl);
  }
  const chart = document.getElementById("pf-equity-chart");
  if (chart) chart.innerHTML = equityCurveSVG(history, summary.starting_cash);
  const pts = document.getElementById("pf-eq-points");
  if (pts) pts.textContent = `${history.length} points`;
  const stamp = document.getElementById("pf-updated");
  if (stamp) stamp.textContent = `live · updated ${new Date().toLocaleTimeString()}`;
}

// Live Execution master switch (2026-07-17): enabling requires the auth
// token AND typing the exact confirmation phrase - shown in the prompt so
// you know what to type, but it must be typed, so it can't happen by
// accident. Disabling is friction-free (one confirm + token).
const LIVE_EXEC_PHRASE = "ENABLE LIVE TRADING";
async function toggleLiveExecution(currentlyOn) {
  let confirmPhrase = "";
  if (!currentlyOn) {
    const typed = prompt(
      "ENABLE LIVE EXECUTION?\n\n" +
      "When Mode=EXECUTE and Auto-Trade are also ON, this app will place REAL " +
      "Robinhood market orders with REAL money - no Claude Desktop checkpoint.\n\n" +
      `To enable, type exactly (without quotes):\n\n    ${LIVE_EXEC_PHRASE}\n`);
    if (typed === null) return;                      // cancelled
    if (typed.trim() !== LIVE_EXEC_PHRASE) {
      toast(`Phrase mismatch — you must type exactly: ${LIVE_EXEC_PHRASE}`, "error");
      return;
    }
    confirmPhrase = typed.trim();
  } else {
    if (!confirm("Disable Live Execution?\n\nThis app will stop placing orders; execution returns to the Claude Desktop trade-prompt flow.")) return;
  }
  const token = await getToken();
  if (!token) return;
  try {
    const r = await fetch("/api/live_execution", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Auth-Token": token },
      body: JSON.stringify({ enable: !currentlyOn, confirm: confirmPhrase }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      toast(body.detail || `Failed (${r.status})`, "error");
      if (r.status === 403) localStorage.removeItem(AUTH_TOKEN_KEY);
      return;
    }
    toast(!currentlyOn ? "LIVE EXECUTION ENABLED" : "Live Execution disabled",
          !currentlyOn ? "error" : "success");
    const cfgR = await fetch("/api/config"); state.config = await cfgR.json();
    renderControlTab(document.getElementById("content"));
  } catch (e) { toast(`Couldn't reach the server: ${e.message}`, "error"); }
}

async function toggleAutoTrade(currentlyOn) {
  if (!currentlyOn) {
    const cfgR = await fetch("/api/config"); const cfg = await cfgR.json();
    const inExecute = cfg.trading?.watch_execute === "EXECUTE";
    const liveOn = !!cfg.trading?.live_execution_enabled;
    const msg = inExecute
      ? (liveOn
          ? "ARM AUTO-TRADE?\n\nMode is EXECUTE and LIVE EXECUTION is ENABLED: from the next signal onward, THIS APP will place REAL Robinhood market orders with REAL money.\n\nKill switch, max positions/size, daily budget, and buying-power checks still apply."
          : "ARM AUTO-TRADE?\n\nMode is EXECUTE (Live Execution is OFF): the generated trade prompt will AUTHORIZE Claude Desktop to place the described orders with REAL money.\n\nThis app itself won't place orders unless the Live Execution master switch is also enabled.")
      : "Turn Auto-Trade ON?\n\nMode is currently WATCH, so nothing real happens yet - it arms once Watch/Execute is switched to EXECUTE.";
    if (!confirm(msg)) return;
  }
  const ok = await saveConfig({ trading: { auto_trade: !currentlyOn } }, true);
  if (ok) toast(!currentlyOn ? "Auto-Trade ARMED" : "Auto-Trade disarmed", !currentlyOn ? "error" : "success");
}

}
function setRotationField(key, val) {

  saveConfig({ rotation: { [key]: n } }, true);

function setRhAccountNumber(val) {

}
function setScreenerMax(val) {

// needsAuth defaults to TRUE (v1.1.1). /api/config has always been
// token-gated on the server, and all twelve call sites already pass true
// explicitly - so this changes no behaviour today. It removes a footgun: the
// old default meant a thirteenth caller that forgot the flag would send no
// token and get an opaque 403. A safety parameter must not default to off.
async function saveConfig(update, needsAuth=true) {
  const headers = { "Content-Type": "application/json" };
  if (needsAuth) {
    const token = await getToken();
    if (!token) return false;
    headers["X-Auth-Token"] = token;
  }
  try {
    const r = await fetch("/api/config", { method: "POST", headers, body: JSON.stringify(update) });
    if (!r.ok) { toast(r.status === 403 ? "Invalid auth token" : "Save failed", "error"); if (r.status===403) localStorage.removeItem(AUTH_TOKEN_KEY); return false; }
    const cfgR = await fetch("/api/config"); state.config = await cfgR.json();
    toast("Saved");
    renderControlTab(document.getElementById("content"));
    return true;
  } catch (e) { toast("Save failed - is the server running?", "error"); return false; }
}

async function addTicker() {
  const input = document.getElementById("ticker-input");
  const btn = document.getElementById("add-ticker-btn");
  const t = input.value.trim().toUpperCase();
  if (!t) return;

  const wl = new Set(state.config?.watchlist || []);
  if (wl.has(t)) { toast(`${t} is already on the watchlist`, "alert"); return; }

  btn.disabled = true;
  const originalHtml = btn.innerHTML;
  btn.innerHTML = `${svg('clock',14)}<span>Checking…</span>`;
  try {
    const res = await authFetch("/api/ticker/validate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticker: t }),
    });
    // authFetch has already explained a 403/429. Without this guard the
    // {detail: ...} error body falls through to `!data.valid` and the user is
    // told the ticker is invalid, which is both wrong and hard to debug.
    if (!res.ok) return;
    const data = await res.json();
    if (!data.valid) {
      toast(`"${t}" doesn't look like a valid ticker (no price data from yfinance)`, "alert");
      return;
    }
    tickerNames[t] = data.name || tickerNames[t];
    wl.add(t);
    input.value = "";
    const saved = await saveConfig({ watchlist: [...wl] }, true);
    if (saved) toast(data.name ? `Added ${t} — ${data.name}` : `Added ${t}`);

    // Evaluate it right away rather than leaving it to show nothing under
    // Signals until the next scheduled cycle (which could be up to
    // scan_interval_minutes away, or not until market open/Monday).
    if (saved) {
      btn.innerHTML = `${svg('clock',14)}<span>Evaluating…</span>`;
      try {
        const evalRes = await authFetch("/api/ticker/evaluate_now", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticker: t }),
        });
        if (evalRes.ok) {
          const ev = await evalRes.json();
          const verdict = ev.should_buy ? "BUY candidate" : "HOLD";
          toast(`${t} evaluated — ${verdict} (${ev.pct_score.toFixed(0)}%). See the Signals tab.`, ev.should_buy ? "success" : "info");
          if (currentTab === "signals" || currentTab === "dashboard") {
            loadTab(currentTab);
          }
        } else {
          const body = await evalRes.json().catch(() => ({}));
          toast(`${t} added, but immediate evaluation failed: ${body.detail || evalRes.statusText}. It'll be picked up on the next scan cycle instead.`, "alert");
        }
      } catch (e) {
        toast(`${t} added, but couldn't reach the server to evaluate it immediately - it'll be picked up on the next scan cycle.`, "alert");
      }
    }
  } catch (e) {
    toast("Couldn't validate ticker - is the server running?", "alert");
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}
function removeTicker(t) {
  const wl = (state.config?.watchlist || []).filter(x => x !== t);
  saveConfig({ watchlist: wl }, true);
}
function setRiskLevel(level) { saveConfig({ risk_level: level }, true); }
function setTradingField(field, value) { saveConfig({ trading: { [field]: value } }, true); }

async function renderLearningTab(el) {
  el.innerHTML = `
    <div class="panel"><div class="panel-head">${svg('learning',15)}<span class="panel-title">Learning Backend</span></div><div id="learning-body">Loading…</div></div>
    <div class="panel" style="margin-top:14px;"><div class="panel-head">${svg('learning',15)}<span class="panel-title">Automated Learning Loop</span></div><div id="learning-runs-body">Loading…</div></div>
    <div class="panel" style="margin-top:14px;">
      <div class="panel-head" style="justify-content:space-between;display:flex;">
        <div style="display:flex;align-items:center;gap:8px;">${svg('learning',15)}<span class="panel-title">Historical Replay (Backtest)</span></div>
        <button class="btn btn-sm backtest-run-trigger" onclick="runBacktestNow(event)">${svg('refresh',13)}<span>Run backtest now</span></button>
      </div>
      <p class="field-desc" style="margin-bottom:12px;">engine/backtest_engine.py's Stage 1 market-data-only replay - runs the REAL rules/hard_vetoes.py + rules/swing_buy_rules.py against historical bars for config.yaml's backtest.tickers/months. Also runs automatically once a week (engine/backtest_loop.py, scheduler.py) - this button just triggers one on demand.</p>
      <div id="backtest-body">Loading…</div>
    </div>
  `;
  try {
    const summary = await fetchJSON("/api/analytics/performance");
    document.getElementById("learning-body").innerHTML = `
      <p class="field-desc" style="margin-bottom:14px;">Pattern database, EV engine, Bayesian weight updater, walk-forward, and champion/challenger all run against closed <code>pattern_database</code> rows — see README for what's real vs. simulated.</p>
      <div class="metrics-row">
        <div class="metric"><div class="metric-label">Closed patterns</div><div class="metric-value">${summary.n_closed_patterns}</div></div>
        <div class="metric"><div class="metric-label">Profit factor</div><div class="metric-value">${summary.profit_factor.toFixed(2)}</div></div>
        <div class="metric"><div class="metric-label">Sharpe</div><div class="metric-value">${summary.sharpe_ratio.toFixed(2)}</div></div>
      </div>
    `;
  } catch (e) {
    document.getElementById("learning-body").innerHTML = tabErrorHTML(e);
  }

  loadBacktestPanel(); // fire-and-forget - independent of the learning_runs early-return below

  const runsBody = document.getElementById("learning-runs-body");
  let runs;
  try {
    runs = await fetchJSON("/api/learning/runs?limit=10");
  } catch (e) {
    runsBody.innerHTML = tabErrorHTML(e);
    return;
  }
  if (!runs.length) {
    runsBody.innerHTML = emptyBlock('learning', 'No automated runs yet',
      `scheduler.py runs this every ${state.config?.learning?.walk_forward_trigger_trades ?? 50} closed trades or ${state.config?.learning?.walk_forward_trigger_days ?? 30} days, whichever comes first.`);
    return;
  }
  const latest = runs[0];
  const props = Object.entries(latest.proposals?.proposals || {});
  const stable = props.filter(([,p]) => p.stability?.stability_label === 'STABLE' && !p.attribution?.insufficient_data);
  const other = props.filter(([,p]) => !(p.stability?.stability_label === 'STABLE' && !p.attribution?.insufficient_data));

  const ruleRow = ([name, p]) => {
    const a = p.attribution || {}, s = p.stability || {};
    const edge = a.edge != null ? (a.edge*100).toFixed(1)+'pp' : '—';
    const badge = s.stability_label === 'STABLE' ? 'pill-green' : s.stability_label === 'SPIKING' ? 'pill-yellow' : s.stability_label === 'VOLATILE' ? 'pill-red' : 'pill';
    return `<tr>
      <td><code style="font-size:12px;">${name}</code></td>
      <td class="num">${a.n_fired ?? 0}</td>
      <td class="num">${edge}</td>
      <td><span class="pill ${badge}">${s.stability_label || '—'}</span></td>
      <td class="subtle">${a.insufficient_data ? 'insufficient data (<20 fires)' : ''}</td>
    </tr>`;
  };

  runsBody.innerHTML = `
    <p class="field-desc" style="margin-bottom:10px;">
      Last run: <b>${fmtCST(latest.run_at)}</b> —
      trigger: <span class="subtle">${latest.trigger_reason}</span> —
      ${latest.n_patterns} closed patterns analyzed —
      ${latest.challenges_evaluated?.length || 0} active challenger test(s) evaluated.
      Every result below is a <b>proposal for human review</b> — nothing is auto-applied to rule weights.
    </p>
    ${props.length ? `<div class="table-wrap"><table><thead><tr><th>Rule</th><th class="num">Fired</th><th class="num">Edge</th><th>Stability</th><th>Note</th></tr></thead><tbody>
      ${[...stable, ...other].map(ruleRow).join('')}
    </tbody></table></div>` : `<p class="field-desc">No rule attribution data yet — needs closed patterns with <code>rules_passed</code> populated.</p>`}
    ${latest.challenges_evaluated?.length ? `<div style="margin-top:14px;">
      <div class="field-label">Champion/Challenger</div>
      ${latest.challenges_evaluated.map(c => `<p class="field-desc">${c.challenge_id?.slice(0,8) || '—'}: ${c.ready ? `<b>${c.recommendation}</b> (champion ${(c.champion_win_rate*100).toFixed(0)}% vs challenger ${(c.challenger_win_rate*100).toFixed(0)}%)` : c.message}</p>`).join('')}
    </div>` : ''}
  `;
}

// 2026-07-23: Learning tab's "Historical Replay (Backtest)" panel -
// engine/backtest_engine.py's Stage 1 replay, triggered weekly by
// engine/backtest_loop.py (scheduler.py) or on demand via the button below
// (server.py's POST /api/backtest/run). Polls /api/backtest/status while a
// run is in progress since there's no websocket push for this yet (unlike
// runCycleNow's cycle_complete event) - simplest thing that works.
let _backtestPollTimer = null;

async function loadBacktestPanel() {
  const body = document.getElementById("backtest-body");
  if (!body) return;
  try {
    const [latest, runs, status] = await Promise.all([
      fetch("/api/backtest/latest").then(r => r.json()),
      fetch("/api/backtest/runs?limit=10").then(r => r.json()),
      fetch("/api/backtest/status").then(r => r.json()),
    ]);
    body.innerHTML = renderBacktestBody(latest, runs);
    _setBacktestButtonRunning(!!status.running);
    if (status.running) _startBacktestPolling();
  } catch (e) {
    body.innerHTML = `<p class="field-desc">Couldn't load backtest results: ${e.message}</p>`;
  }
}

function _setBacktestButtonRunning(running) {
  const btn = document.querySelector(".backtest-run-trigger");
  if (!btn) return;
  btn.disabled = running;
  btn.innerHTML = running ? `${svg("refresh",13)}<span>Running…</span>` : `${svg("refresh",13)}<span>Run backtest now</span>`;
}

function _startBacktestPolling() {
  if (_backtestPollTimer) return; // already polling
  _backtestPollTimer = setInterval(async () => {
    try {
      const status = await (await fetch("/api/backtest/status")).json();
      if (!status.running) {
        clearInterval(_backtestPollTimer);
        _backtestPollTimer = null;
        _setBacktestButtonRunning(false);
        toast("Backtest complete.", "success");
        if (currentTab === "learning") loadBacktestPanel();
      }
    } catch (e) { /* keep polling - a transient fetch error shouldn't stop it */ }
  }, 5000);
}

async function runBacktestNow(evt) {
  const btn = evt ? evt.currentTarget : document.querySelector(".backtest-run-trigger");
  if (!btn) return;
  btn.disabled = true;
  btn.innerHTML = `${svg("refresh",13)}<span>Starting…</span>`;
  try {
    const res = await authFetch("/api/backtest/run", { method: "POST" });
    if (res.status === 409) {
      toast("A backtest is already running - hang tight.", "info");
      _setBacktestButtonRunning(true);
      _startBacktestPolling();
      return;
    }
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      toast(`Couldn't start backtest: ${errBody.detail || res.statusText}`, "error");
      _setBacktestButtonRunning(false);
      return;
    }
    toast("Backtest started - this can take a minute or two for a dozen-plus tickers.", "success");
    _setBacktestButtonRunning(true);
    _startBacktestPolling();
  } catch (e) {
    toast(`Couldn't reach the server: ${e.message}`, "error");
    _setBacktestButtonRunning(false);
  }
}

function renderBacktestBody(latest, runs) {
  if (!latest || !latest.status) {
    return emptyBlock('learning', 'No backtest runs yet',
      `Runs automatically every ${state.config?.backtest?.weekly_trigger_days ?? 7} days, or click "Run backtest now" above.`);
  }
  const s = latest.summary || {};
  const statusPill = latest.status === 'completed' ? 'pill-green' : latest.status === 'running' ? 'pill-yellow' : 'pill-red';
  const tickerList = (latest.tickers || []).join(', ');
  const header = `
    <p class="field-desc" style="margin-bottom:10px;">
      Last run: <b>${fmtCST(latest.started_at)}</b> (<span class="pill ${statusPill}" style="padding:1px 6px;">${latest.status}</span>, triggered by <span class="subtle">${latest.triggered_by || '—'}</span>) —
      ${latest.start_date} to ${latest.end_date} — tickers: <span class="subtle">${tickerList}</span>
    </p>`;
  if (latest.status === 'failed') {
    return header + `<p class="field-desc">Failed: <span style="color:var(--red);">${latest.error || 'unknown error'}</span></p>` + _renderBacktestHistory(runs);
  }
  if (latest.status === 'running' || !s.n_trades) {
    const body = latest.status === 'running'
      ? `<p class="field-desc">Still running…</p>`
      : `<p class="field-desc">Scored ${latest.n_scored ?? 0} candidate-days, ${Object.keys(latest.veto_counts||{}).length ? 'vetoes: ' + JSON.stringify(latest.veto_counts) : 'no vetoes fired'}. No trades cleared the dynamic threshold this run - see engine/backtest_engine.py's module docstring on Stage 1's scope (EXTERNAL/SENTIMENT_MACRO/MARKET_BREADTH unavailable) before assuming this is a bug.</p>`;
    return header + body + _renderBacktestHistory(runs);
  }
  return header + `
    <div class="metrics-row" style="margin-bottom:12px;">
      <div class="metric"><div class="metric-label">Trades</div><div class="metric-value">${s.n_trades}</div></div>
      <div class="metric"><div class="metric-label">Win rate</div><div class="metric-value">${s.win_rate}%</div></div>
      <div class="metric"><div class="metric-label">Avg outcome</div><div class="metric-value">${s.avg_outcome_pct}%</div></div>
      <div class="metric"><div class="metric-label">Profit factor</div><div class="metric-value">${s.profit_factor ?? '—'}</div></div>
      <div class="metric"><div class="metric-label">Avg hold</div><div class="metric-value">${s.avg_hold_days}d</div></div>
    </div>
    <p class="field-desc" style="margin-bottom:10px;">Exit reasons: ${Object.entries(s.exit_reason_counts||{}).map(([k,v])=>`${k} (${v})`).join(', ') || '—'} — Scored ${latest.n_scored ?? 0} candidate-days total.</p>
    ${(latest.trades||[]).length ? `<div class="table-wrap" style="margin-bottom:12px;"><table><thead><tr><th>Ticker</th><th>Entry</th><th>Exit</th><th class="num">Score</th><th class="num">Outcome</th><th>Reason</th></tr></thead><tbody>
      ${latest.trades.slice(0,20).map(t => `<tr>
        <td><code style="font-size:11px;">${t.ticker}</code></td>
        <td class="subtle">${t.entry_date}</td>
        <td class="subtle">${t.exit_date}</td>
        <td class="num">${t.buy_score_pct}%</td>
        <td class="num" style="color:${t.outcome_pct>=0?'var(--green)':'var(--red)'};">${t.outcome_pct>=0?'+':''}${t.outcome_pct}%</td>
        <td class="subtle">${t.exit_reason}</td>
      </tr>`).join('')}
    </tbody></table></div>${latest.trades.length > 20 ? `<p class="field-desc">+${latest.trades.length-20} more in results.json (${latest.output_dir || 'output/backtest_results/'}).</p>` : ''}` : ''}
    ${_renderBacktestHistory(runs)}
  `;
}

function _renderBacktestHistory(runs) {
  if (!runs || runs.length < 2) return '';
  return `
    <div class="field-label" style="margin-top:14px;margin-bottom:6px;">Recent runs</div>
    <div class="table-wrap"><table><thead><tr><th>Started</th><th>Status</th><th>Trigger</th><th class="num">Trades</th><th class="num">Win rate</th></tr></thead><tbody>
      ${runs.map(r => `<tr>
        <td class="subtle">${fmtCST(r.started_at)}</td>
        <td><span class="pill ${r.status==='completed'?'pill-green':r.status==='running'?'pill-yellow':'pill-red'}" style="padding:1px 6px;">${r.status}</span></td>
        <td class="subtle">${r.triggered_by || '—'}</td>
        <td class="num">${r.summary?.n_trades ?? '—'}</td>
        <td class="num">${r.summary?.win_rate != null ? r.summary.win_rate+'%' : '—'}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

const STATUS_PILL = { REAL: 'pill-green', PROXY: 'pill-yellow', PLACEHOLDER: 'pill-red' };

async function renderStrategyTab(el) {
  el.innerHTML = `<div id="strategy-body"><p class="field-desc">Loading…</p></div>`;
  const body = document.getElementById("strategy-body");

  // Everything - the fetch AND the HTML-building below - is wrapped in one
  // try/catch. Previously only the fetch was guarded, so a malformed/missing
  // response (e.g. a stale server process still running the pre-Strategy-tab
  // code, which 404s /api/strategy) threw an uncaught TypeError while
  // building the template literal and silently left the tab stuck on
  // "Loading…" with no visible error - looked like "shows nothing".
  try {
    const res = await fetch("/api/strategy");
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      throw new Error(`HTTP ${res.status} ${detail}`);
    }
    const s = await res.json();
    if (!s || !s.buy_rules || !s.hard_vetoes || !s.sell_rules || !s.sell_rules_catalog) {
      throw new Error("Response is missing expected fields (buy_rules/hard_vetoes/sell_rules/sell_rules_catalog) - the server may be running an older version of server.py. Restart it.");
    }
    body.innerHTML = renderStrategyBody(s);
    loadStopCalibrationPanel();
  } catch (e) {
    body.innerHTML = `<p class="field-desc">Couldn't load the strategy page: ${e.message}. If you just added this feature, restart <code>server.py</code> (it's a separate long-running process and won't pick up new routes until restarted) and hard-refresh this page.</p>`;
  }
}

// 2026-07-22, Trinath's ATR stop-machine review: DAY and SWING used to share
// identical multipliers/thresholds - this panel shows the mode-aware split
// now in effect (engine/stop_state_machine.py + config.yaml's stop_machine
// section), live from config, plus the 6-state description and the ATR-spike
// widening / risk-cap safety rules. sm = s.stop_machine ({catalog, live_config}).
function renderStopMachinePanel(sm, riskLevel) {
  if (!sm) return "";
  const lc = sm.live_config || {};
  const day = lc.DAY || {}, sw = lc.SWING || {}, spike = lc.atr_spike || {};
  const row = (label, key, fmt) => `<tr>
      <td class="subtle">${label}</td>
      <td class="num">${fmt ? fmt(day[key]) : (day[key] ?? '—')}</td>
      <td class="num">${fmt ? fmt(sw[key]) : (sw[key] ?? '—')}</td>
    </tr>`;
  const xR = v => v == null ? '—' : `${v}R`;
  const xATR = v => v == null ? '—' : `${v}x ATR`;
  return `
    <div class="panel">
      <div class="panel-head">${svg('risk',15)}<span class="panel-title">ATR Stop Machine — Mode-Aware Parameters (live)</span></div>
      <p class="field-desc" style="margin-bottom:12px;">${sm.catalog.engine}</p>
      <div class="table-wrap" style="margin-bottom:14px;"><table><thead><tr><th>Parameter</th><th class="num">DAY</th><th class="num">SWING</th></tr></thead><tbody>
        ${row('Initial ATR× — strong setup (score ≥85)', 'atr_multiplier_strong', v => v == null ? '—' : `${v}x`)}
        ${row('Initial ATR× — standard setup', 'atr_multiplier_standard', v => v == null ? '—' : `${v}x`)}
        ${row('Initial ATR× — weak setup (score <65)', 'atr_multiplier_weak', v => v == null ? '—' : `${v}x`)}
        <tr><td class="subtle">Initial stop hard cap (current risk profile)</td><td class="num">${lc.stop_loss_day_pct != null ? lc.stop_loss_day_pct+'%' : '—'}</td><td class="num">${lc.stop_loss_swing_pct != null ? lc.stop_loss_swing_pct+'%' : '—'}</td></tr>
        ${row('Breakeven activates at', 'breakeven_r', xR)}
        ${row('Breakeven lock (x risk/share)', 'breakeven_lock_r', v => v == null ? '—' : `${v}R`)}
        ${row('Profit-protect activates at', 'profit_protect_r', xR)}
        ${row('Profit-protect lock (x risk/share)', 'profit_protect_lock_r', v => v == null ? '—' : `${v}R`)}
        ${row('Profit-protect trail distance', 'profit_protect_trail_atr_mult', xATR)}
        ${row('Trend-trail activates at', 'trend_trail_r', xR)}
        ${row('Trend-trail distance', 'trend_trail_atr_mult', xATR)}
      </tbody></table></div>
      <div class="grid grid-3" style="gap:8px;margin-bottom:12px;">
        <div class="stat"><div class="label">ATR-spike threshold</div><div class="value">${spike.atr_pct_threshold != null ? spike.atr_pct_threshold+'%' : '—'}</div></div>
        <div class="stat"><div class="label">ATR-spike multiplier bonus</div><div class="value">+${spike.multiplier_bonus ?? '—'}x</div></div>
        <div class="stat"><div class="label">Risk profile shown</div><div class="value">${riskLevel || '—'}</div></div>
      </div>
      <p class="field-desc" style="margin-bottom:12px;">When ATR is ${spike.atr_pct_threshold ?? '—'}% of price or more (a real volatility shock, not normal chop), the initial-stop multiplier widens by the bonus above — still bounded by the caps in the table. Pairs with (does not replace) position sizing's own volatility bands, which already shrink size in the same regime.</p>
      <div class="table-wrap"><table><thead><tr><th>State</th><th>Behavior</th></tr></thead><tbody>
        ${sm.catalog.states.map(st => `<tr><td><code style="font-size:11px;">${st.name}</code></td><td class="subtle">${st.description}</td></tr>`).join('')}
      </tbody></table></div>

}

// 2026-07-22, wires up analytics/trade_attribution.py's /api/analytics/attribution
// (previously dead code, no route/UI) - shows the STOP_TOO_TIGHT/ENTRY_TOO_EARLY/etc.
// breakdown split DAY vs SWING, matching the panel's field-desc explanation above.
async function loadStopCalibrationPanel() {
  const el = document.getElementById("stop-calibration-body");
  if (!el) return;
  let data;
  try {
    data = await (await fetch("/api/analytics/attribution")).json();
  } catch (e) {
    el.innerHTML = `<p class="field-desc">Couldn't load stop-loss calibration: ${e.message}</p>`;
    return;
  }
  const REASON_LABELS = {
    STOP_TOO_TIGHT: "Stop too tight", ENTRY_TOO_EARLY: "Entry too early (poor setup)",
    TREND_FAILURE: "Trend failure", MARKET_DETERIORATION: "Market deterioration",
    NEWS_EVENT: "News/event shock", PROFIT_TARGET_TOO_CONSERVATIVE: "Profit target too conservative",
    EXIT_SCORE_DETERIORATION: "Exit score deterioration",
  };
  const pillClass = r => (r === "STOP_TOO_TIGHT" || r === "ENTRY_TOO_EARLY") ? "pill-yellow" : "pill-neutral";
  const modeBlock = (label, d) => {
    const entries = Object.entries(d.by_reason || {}).filter(([, v]) => v.n > 0);
    if (!d.n_trades) {
      return `<div style="margin-bottom:12px;"><div class="field-label" style="margin-bottom:6px;">${label} (0 closed trades)</div><p class="field-desc">No closed ${label} trades yet.</p></div>`;
    }
    return `<div style="margin-bottom:16px;">
      <div class="field-label" style="margin-bottom:6px;">${label} (${d.n_trades} closed trades)</div>
      <div class="table-wrap"><table><thead><tr><th>Reason</th><th class="num">Count</th><th class="num">Win rate</th><th class="num">Avg outcome</th></tr></thead><tbody>
        ${entries.map(([reason, v]) => `<tr>
          <td><span class="pill ${pillClass(reason)}" style="padding:1px 6px;">${REASON_LABELS[reason]||reason}</span></td>
          <td class="num">${v.n}</td>
          <td class="num">${v.win_rate != null ? (v.win_rate*100).toFixed(0)+'%' : '—'}</td>
          <td class="num">${v.avg_outcome_pct != null ? (v.avg_outcome_pct>=0?'+':'')+v.avg_outcome_pct+'%' : '—'}</td>
        </tr>`).join('')}
      </tbody></table></div>
    </div>`;
  };
  if (!data.DAY?.n_trades && !data.SWING?.n_trades) {
    el.innerHTML = emptyBlock('inbox', 'No closed trades to classify yet',
      'Once DAY/SWING trades close, this breaks down how many were STOP_TOO_TIGHT vs ENTRY_TOO_EARLY vs other reasons, per mode.');
    return;
  }
  el.innerHTML = modeBlock('DAY', data.DAY || {n_trades:0,by_reason:{}}) + modeBlock('SWING', data.SWING || {n_trades:0,by_reason:{}});
}

function renderEvolutionSection(evo) {
  const parts = [];

  parts.push(`<div class="field-label" style="margin-bottom:6px;">Walk-forward learning runs</div>`);
  if (evo.learning_runs && evo.learning_runs.length) {
    parts.push(`<div class="table-wrap"><table><thead><tr><th>Run</th><th>Trigger</th><th class="num">Patterns</th><th class="num">Stable rules</th></tr></thead><tbody>
      ${evo.learning_runs.map(r => {
        const props = Object.values(r.proposals?.proposals || {});
        const stable = props.filter(p => p.stability?.stability_label === 'STABLE' && !p.attribution?.insufficient_data).length;
        return `<tr><td class="subtle">${fmtCST(r.run_at)}</td><td class="subtle">${r.trigger_reason}</td><td class="num">${r.n_patterns}</td><td class="num">${stable}/${props.length}</td></tr>`;
      }).join('')}
    </tbody></table></div><p class="field-desc" style="margin-top:6px;">Full rule-by-rule breakdown is on the Learning tab.</p>`);
  } else {
    parts.push(`<p class="field-desc">No runs yet - scheduler.py triggers this automatically every N closed trades / M days (see the Learning tab).</p>`);
  }

  parts.push(`<div class="field-label" style="margin-top:18px;margin-bottom:6px;">Bayesian weight-change history</div>`);
  if (evo.bayesian_history && evo.bayesian_history.length) {
    parts.push(`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Rule</th><th>Bucket</th><th class="num">Old→New</th><th>Applied</th></tr></thead><tbody>
      ${evo.bayesian_history.map(h => `<tr>
        <td class="subtle">${fmtCST(h.timestamp)}</td>
        <td><code style="font-size:11px;">${h.rule_name}</code></td>
        <td class="subtle">${h.bucket||'—'}</td>
        <td class="num">${h.old_weight?.toFixed(2)} → ${h.new_weight?.toFixed(2)}</td>
        <td>${h.applied ? `<span class="pill pill-green" style="padding:1px 6px;">applied</span>` : `<span class="pill pill-red" style="padding:1px 6px;">blocked</span>`}</td>
      </tr>`).join('')}
    </tbody></table></div>`);
  } else {
    parts.push(`<p class="field-desc">None yet. The buy-rule point values shown above are hardcoded in rules/swing_buy_rules.py, not read from config.yaml, so there's no live weight for a Bayesian proposal to target - this history stays empty until that's wired up. See engine/learning_loop.py's docstring.</p>`);
  }

  parts.push(`<div class="field-label" style="margin-top:18px;margin-bottom:6px;">Champion/Challenger tests</div>`);
  if (evo.challenges && evo.challenges.length) {
    parts.push(`<div class="table-wrap"><table><thead><tr><th>Started</th><th>Status</th><th class="num">Champion trades</th><th class="num">Challenger trades</th><th class="num">Significance</th></tr></thead><tbody>
      ${evo.challenges.map(c => {
        const cls = c.status === 'promoted' ? 'pill-green' : c.status === 'discarded' ? 'pill-red' : 'pill-yellow';
        return `<tr>
          <td class="subtle">${fmtCST(c.challenger_start)}</td>
          <td><span class="pill ${cls}" style="padding:1px 6px;">${c.status}</span></td>
          <td class="num">${c.champion_trades}</td>
          <td class="num">${c.challenger_trades}</td>
          <td class="num">${c.statistical_significance!=null ? c.statistical_significance.toFixed(3) : '—'}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`);
  } else {
    parts.push(`<p class="field-desc">No challenger configs have been started (a deliberate manual action via ChampionChallenger.start_challenge() - the automated learning loop only re-evaluates challenges someone already started, it never starts one on its own).</p>`);
  }

  return parts.join('');
}

// EXIT well-timed", this asks "was the REJECTION (HOLD via dynamic
// threshold) justified". Segments HOLD signals by the size of the threshold
// adjustment that rejected them and isolates the market-breadth
// double-counting concern the review specifically flagged. Plain GET loads
// the latest cached run (automatic weekly, engine/learning_loop.py) instantly;
// "Run Now" hits POST /api/analytics/threshold_regret/run for an on-demand
// evaluation, same parity Trinath asked for with the Learning tab's "Run
// Backtest Now" button - but this one runs inline (cheap, mostly cached),
// no polling loop needed.
function verdictPillClass(v) {
  if (v === "threshold_may_be_too_strict_here") return "pill-yellow";
  if (v === "threshold_appears_justified_here") return "pill-green";
  return "pill-neutral";
}
const VERDICT_LABELS = {
  threshold_may_be_too_strict_here: "May be too strict",
  threshold_appears_justified_here: "Appears justified",
  insufficient_data: "Insufficient data",
};
async function loadThresholdRegretPanel(runNow) {
  const el = document.getElementById("threshold-regret-body");
  if (!el) return;
  el.innerHTML = "Loading…" + (runNow ? " (evaluating, may take a moment)" : "");
  let report;
  try {
    if (runNow) {
      report = await (await authFetch("/api/analytics/threshold_regret/run", { method: "POST" })).json();
    } else {
      report = await (await fetch("/api/analytics/threshold_regret")).json();
    }
  } catch (e) {
    el.innerHTML = `<p class="field-desc">Couldn't load threshold regret analysis: ${e.message}</p>`;
    return;
  }
  if (report && report.not_yet_run) {
    el.innerHTML = emptyBlock('inbox', 'Not evaluated yet',
      report.message || 'Click "Run Now" above to evaluate, or wait for the weekly automatic run.');
    return;
  }
  if (!report || !report.n_signals) {
    el.innerHTML = emptyBlock('inbox', 'No HOLD signals to evaluate yet',
      'Once the scanner scores tickers that miss the dynamic buy threshold, this checks what they did afterward and flags whether the rejection was justified — broken down by how large the threshold adjustment was.');
    return;
  }
  const overall = report.overall || {};
  const buckets = report.by_adjustment_bucket || [];
  const br = report.breadth_isolation || {};
  const pen = br.breadth_penalized || {}, neu = br.breadth_neutral_or_better || {};
  el.innerHTML = `
    <p class="field-desc" style="margin-bottom:8px;">${report.n_evaluated} of ${report.n_signals} HOLD signal(s) evaluated (${report.n_still_pending} still pending). ${overall.n ? `Overall avg would-have-returned <b>${overall.avg_would_have_returned_pct>=0?'+':''}${overall.avg_would_have_returned_pct}%</b>, win rate ${overall.pct_would_have_won}% (n=${overall.n}).` : ''}</p>
    <div class="field-label" style="margin:12px 0 6px;">By threshold-adjustment size</div>
    <div class="table-wrap"><table><thead><tr><th>Adjustment</th><th class="num">n</th><th class="num">Avg return</th><th class="num">Win rate</th><th>Verdict</th></tr></thead><tbody>
    ${buckets.map(b => `<tr>
      <td>${b.bucket}</td>
      <td class="num">${b.n}</td>
      <td class="num">${b.avg_would_have_returned_pct != null ? (b.avg_would_have_returned_pct>=0?'+':'')+b.avg_would_have_returned_pct.toFixed(1)+'%' : "—"}</td>
      <td class="num">${b.pct_would_have_won != null ? b.pct_would_have_won.toFixed(0)+'%' : "—"}</td>
      <td><span class="pill ${verdictPillClass(b.verdict)}">${VERDICT_LABELS[b.verdict] || b.verdict}</span></td>
    </tr>`).join("")}
    </tbody></table></div>
    <div class="field-label" style="margin:14px 0 6px;">Breadth-penalty isolation</div>
    <p class="field-desc">MARKET_BREADTH is both an 11%-weighted scoring bucket AND a separate threshold penalty — this checks whether the penalty is doing real work or double-counting.</p>
    <div style="margin-top:6px;">
      <span class="pill pill-neutral" style="margin-right:6px;">Breadth penalized: n=${pen.n||0}${pen.n?`, ${pen.avg_would_have_returned_pct>=0?'+':''}${pen.avg_would_have_returned_pct}% avg, ${pen.pct_would_have_won}% win`:''}</span>
      <span class="pill pill-neutral">Breadth neutral/better: n=${neu.n||0}${neu.n?`, ${neu.avg_would_have_returned_pct>=0?'+':''}${neu.avg_would_have_returned_pct}% avg, ${neu.pct_would_have_won}% win`:''}</span>
    </div>`;
}

// Regret Analysis panel (2026-07-17, Akhil: "is it possible to build a
// process that monitors the sold stocks for stop loss and see how they
// behave for a few weeks and learn from the behaviour") - analytics/
// regret_analysis.py already existed (forward-simulates real price history
// after every closed trade and classifies the exit as well-timed vs. too
// tight/conservative) but had no route or UI before this. Covers PAPER
// closes too (most of what this account has right now), not just confirmed
// real fills - that's why it's a separate panel from the Trade Journal table
// above rather than folded into it. First load per trade can be slow (real
// yfinance forward-price lookups); results are cached server-side per
// pattern_id, so a plain reload is fast - "Refresh" forces recomputation.
const CLASSIFICATION_LABELS = {
  well_timed_exit: "Well-timed exit",
  well_timed_exit_avoided_downside: "Well-timed (avoided downside)",
  stop_too_tight: "Stop too tight",
  target_too_conservative: "Target too conservative",
  exit_score_too_aggressive: "Exit score too aggressive",
  time_stop_too_early: "Time stop too early",
  manual_exit_left_upside: "Manual exit left upside",
  unclassified_material_regret: "Unclassified regret",
  still_maturing: "Still maturing",
};
function classificationPillClass(cls) {
  if (cls === "stop_too_tight" || cls === "target_too_conservative" ||
      cls === "exit_score_too_aggressive" || cls === "time_stop_too_early" ||
      cls === "manual_exit_left_upside" || cls === "unclassified_material_regret") return "pill-yellow";
  if (cls === "well_timed_exit" || cls === "well_timed_exit_avoided_downside") return "pill-green";
  return "pill-neutral";
}
async function loadRegretPanel(forceRecompute, limit) {
  const el = document.getElementById("regret-body");
  if (!el) return;
  limit = limit || 25;
  el.innerHTML = "Loading…" + (forceRecompute || limit > 25
    ? ` (evaluating up to ${limit} trades against real price history — first-time evaluations take a couple seconds each, so this can take a minute or two; already-evaluated trades are cached and load instantly)`
    : "");
  let report;
  try {
    const url = `/api/analytics/regret?limit=${limit}` + (forceRecompute ? "&force_recompute=true" : "");
    report = await (await fetch(url)).json();
  } catch (e) {
    el.innerHTML = `<p class="field-desc">Couldn't load regret analysis: ${e.message}</p>`;
    return;
  }
  const records = report.records || [];
  if (!records.length) {
    el.innerHTML = emptyBlock('inbox', 'No closed trades to evaluate yet',
      'Once trades close (paper or real), this checks what the ticker did in the following weeks and flags whether the exit was well-timed or left upside on the table.');
    return;
  }
  const summary = report.summary || {};
  const summaryHtml = Object.entries(summary).map(([cls, s]) =>
    `<span class="pill ${classificationPillClass(cls)}" style="margin:2px 4px 2px 0;" title="avg regret ${s.avg_regret_pct>=0?'+':''}${s.avg_regret_pct}%">${CLASSIFICATION_LABELS[cls]||cls}: ${s.n}</span>`
  ).join("");
  el.innerHTML = `
    <p class="field-desc" style="margin-bottom:8px;">For each closed trade, checks real price history in the weeks after the exit and flags whether it was well-timed or left upside on the table. ${report.n_evaluated} trade(s) evaluated (most recent ${limit} considered). <a href="#" onclick="loadRegretPanel(false, ${limit + 25}); return false;">Load ${limit + 25}</a></p>
    <div style="margin-bottom:12px;">${summaryHtml}</div>
    <div class="table-wrap"><table><thead><tr><th>Ticker</th><th>Exit reason</th><th class="num">Regret</th><th class="num">Downside avoided</th><th>Classification</th></tr></thead><tbody>
    ${records.map(r => `<tr>
      <td><b>${tickerLabel(r.ticker)}</b></td>
      <td class="subtle" style="max-width:260px;white-space:normal;">${r.exit_reason || "—"}</td>
      <td class="num">${r.regret_pct != null ? (r.regret_pct>=0?'+':'')+r.regret_pct.toFixed(1)+'%' : "—"}</td>
      <td class="num">${r.downside_avoided_pct != null ? (r.downside_avoided_pct>=0?'+':'')+r.downside_avoided_pct.toFixed(1)+'%' : "—"}</td>
      <td><span class="pill ${classificationPillClass(r.classification)}">${CLASSIFICATION_LABELS[r.classification] || r.classification}</span></td>
    </tr>`).join("")}
  </tbody></table></div>`;
}

function renderTradeDetail(t) {
  const snap = t.snapshot;
  if (!snap) {
    return `<div style="padding:12px 4px 16px 34px;"><p class="field-desc">No indicator/rule snapshot recorded for this transaction (logged before this feature was added).</p></div>`;
  }
  const parts = [];
  const sig = snap.recent_signal;
  const feats = snap.trigger === 'buy' ? snap.pattern_features : snap.entry_pattern_features;

  if (snap.trigger === 'sell') {
    parts.push(`<div class="field-label" style="margin-bottom:6px;">Exit result</div>`);
    parts.push(`<p class="field-desc">Entry $${snap.entry_price?.toFixed(2)} &rarr; Exit $${snap.fill_price?.toFixed(2)} | P&L $${snap.pnl?.toFixed(2)} (${snap.pnl_pct>=0?'+':''}${snap.pnl_pct?.toFixed(2)}%)</p>`);
  }

  if (sig && sig.bucket_scores && sig.bucket_scores.length) {
    parts.push(`<div class="field-label" style="margin-top:14px;margin-bottom:6px;">6-bucket score breakdown (most recent scan before this ${snap.trigger})</div>`);
    parts.push(renderBucketScores(sig.bucket_scores));
  } else if (sig && sig.rules_failed && sig.rules_failed.length) {
    parts.push(`<p class="field-desc" style="margin-top:14px;">${sig.rules_failed.map(r=>`<b>${r.name}</b>: ${r.detail}`).join('<br>')}</p>`);
  }

  if (sig && sig.sell_triggered_rule) {
    parts.push(`<div class="field-label" style="margin-top:14px;margin-bottom:4px;">Sell rule (most recent scan)</div>`);
    parts.push(`<p class="field-desc"><b>${sig.sell_triggered_rule}</b>: ${sig.sell_reason||''}</p>`);
    parts.push(`<p class="field-desc">${sellRuleExplainer(sig.sell_triggered_rule)}</p>`);
  }

  if (feats) {
    const fmt = (v, d=1) => (v === undefined || v === null) ? null : (typeof v === 'number' ? v.toFixed(d) : v);
    const rows = [
      [withTip('RSI(14)', 'ind_rsi'), fmt(feats.rsi14)],
      ['MACD crossover', feats.macd_crossover],
      [withTip('Bollinger %B', 'ind_bb_pct'), fmt(feats.bb_pct, 2)],
      [withTip('Stochastic K', 'ind_stoch'), fmt(feats.stochastic_k)],
      [withTip('Volume ratio', 'ind_vol_ratio'), feats.volume_ratio!=null?fmt(feats.volume_ratio,2)+'x':null],
      [withTip('Change %', 'ind_change_pct'), feats.change_pct!=null?fmt(feats.change_pct,2)+'%':null],
      [withTip('VIX', 'vix'), fmt(feats.vix_raw)],
      [withTip('Fear &amp; Greed', 'fg_score'), feats.fg_score!=null?`${feats.fg_score} (${feats.fg_rating||''})`:null],
      ['Regime', feats.regime],
      ['Setup type', feats.setup_type],
      ['Sector', feats.sector],
      ['Finviz rating', feats.finviz_rating],
      ['Analyst consensus', feats.analyst_consensus],
      ['Insider direction', feats.insider_direction],
    ].filter(([,v]) => v !== null && v !== undefined && v !== 'unknown' && v !== 'N/A');
    if (rows.length) {
      parts.push(`<div class="field-label" style="margin-top:14px;margin-bottom:6px;">Key indicators ${snap.trigger==='buy'?'at entry':'at original entry'}</div>`);
      parts.push(`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;">` +
        rows.map(([k,v]) => `<div class="subtle" style="font-size:11px;"><b style="color:var(--text-0);">${k}:</b> ${v}</div>`).join('') + `</div>`);
    }
  }

  if (!sig && !feats) {
    parts.push(`<p class="field-desc">No rule/indicator detail in this snapshot.</p>`);
  }

  return `<div style="padding:12px 4px 16px 34px;">${parts.join("")}</div>`;
}

async function resolveAlert(alertId) {
  try {
    const res = await authFetch(`/api/alerts/${encodeURIComponent(alertId)}/resolve`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resolution: "dismissed from UI" }),
    });
    // The response was previously discarded, so a rejected request still
    // reported "Alert dismissed" and the row vanished from the UI while the
    // alert remained open in the database.
    if (!res.ok) return;
    toast("Alert dismissed");
    renderAlertsPanel();
  } catch (e) { toast("Couldn't dismiss alert - is the server running?", "alert"); }
}

let logsLevelFilter = "";  // kept outside renderLogsTab so a full re-render
                            // (e.g. triggered by cycle_complete) doesn't
                            // silently reset your filter choice back to "All"

function _logLineColor(raw) {
  if (raw.includes(" CRITICAL ") || raw.includes(" ERROR ")) return "var(--red)";
  if (raw.includes(" WARNING ")) return "var(--yellow)";
  return "var(--text-1)";
}

async function renderLogsTab(el) {
  el.innerHTML = `

          <option value="" ${logsLevelFilter===""?"selected":""}>All levels</option>

async function loadLogsBody() {
  const body = document.getElementById("logs-body");
  if (!body) return;
  let data = { lines: [] };
  try {
    const qs = logsLevelFilter ? `?level=${encodeURIComponent(logsLevelFilter)}` : "";
    data = await (await fetch(`/api/logs${qs}`)).json();
  } catch (e) {
    body.innerHTML = `<div class="subtle">Couldn't load logs - is the server running?</div>`;
    return;
  }
  const lines = data.lines || [];
  if (!lines.length) {
    body.innerHTML = emptyBlock('inbox', 'No log lines yet', 'Logs appear here once scheduler.py/server.py have been running for a bit.');

  const wasAtBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 20;
  body.innerHTML = lines.map(l =>
    `<div style="color:${_logLineColor(l.raw)};">${l.raw.replace(/</g,'&lt;')}</div>`
  ).join("");
  if (wasAtBottom) body.scrollTop = body.scrollHeight;  // stick to newest lines unless you've scrolled up to read history
}

  const fgColor = fg == null ? "var(--text-2)" : fg < 30 ? "var(--red)" : fg > 60 ? "var(--yellow)" : "var(--green)";
  const vix = mood.vix_level;
  const vixColor = vix == null ? "var(--text-2)" : vix > 27 ? "var(--red)" : vix > 22 ? "var(--yellow)" : "var(--green)";
  const blackout = mood.blackout_active
    ? `<span class="pill pill-red" style="padding:1px 6px;">active${mood.blackout_reason ? " — " + mood.blackout_reason : ""}</span>`
    : `<span class="pill pill-neutral" style="padding:1px 6px;">clear</span>`;
  const hoursToMacro = mood.hours_to_next_macro != null ? `${mood.hours_to_next_macro.toFixed(1)}h to next macro event` : "";
  return `
    <div class="metrics-row" style="grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));">
      <div class="metric">
        <div class="metric-label">${withTip('Fear &amp; Greed', 'fg_score')}</div>
        <div class="metric-value" style="color:${fgColor};">${fg ?? "—"}</div>
        <div class="subtle">${mood.fear_greed_rating || ""}</div>
      </div>
      <div class="metric">
        <div class="metric-label">${withTip('VIX', 'vix')}</div>
        <div class="metric-value" style="color:${vixColor};">${vix != null ? vix.toFixed(1) : "—"}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Regime</div>
        <div class="metric-value" style="font-size:13px;">${mood.regime || "—"}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Macro Blackout</div>
        <div style="margin-top:4px;">${blackout}</div>
        <div class="subtle" style="margin-top:2px;">${hoursToMacro}</div>
      </div>
    </div>
    <div class="subtle" style="margin-top:10px;">As of ${fmtCST(mood.as_of)} CT - recalculated every scan cycle.</div>
  `;
}

async function renderNewsTab(el) {
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">${svg('performance',15)}<span class="panel-title">Market Mood</span></div>
      <div id="news-mood-body">Loading…</div>
    </div>
    <div class="panel">
      <div class="panel-head">${svg('news',15)}<span class="panel-title">News Feed</span><span class="fill"></span>
        <select id="news-filter" class="input" style="width:auto;padding:4px 8px;font-size:12px;" onchange="newsNotableOnly=(this.value==='notable');loadNewsBody()">
          <option value="all" ${!newsNotableOnly?"selected":""}>All headlines</option>
          <option value="notable" ${newsNotableOnly?"selected":""}>Notable only (bullish/bearish)</option>
        </select>
        <button class="btn btn-sm" onclick="loadNewsBody()">${svg("refresh",13)}<span>Refresh</span></button>
      </div>
      <div class="subtle" style="margin-bottom:8px;">Real yfinance headlines scored for sentiment, gathered per ticker during each scan cycle (last 72h, deduped). Not investment advice - a rough directional read only.</div>
      <div id="news-body">Loading…</div>
    </div>
  `;
  await loadNewsBody();
}

async function loadNewsBody() {
  const moodEl = document.getElementById("news-mood-body");
  const bodyEl = document.getElementById("news-body");
  if (!moodEl || !bodyEl) return;
  let data = { news: [], market_mood: {} };
  try {
    const qs = newsNotableOnly ? "?notable_only=true" : "";
    data = await (await fetch(`/api/news${qs}`)).json();
  } catch (e) {
    moodEl.innerHTML = `<div class="subtle">Couldn't load market mood - is the server running?</div>`;
    bodyEl.innerHTML = `<div class="subtle">Couldn't load news - is the server running?</div>`;
    return;
  }
  moodEl.innerHTML = newsMoodPanel(data.market_mood);
  const items = data.news || [];
  if (!items.length) {
    bodyEl.innerHTML = emptyBlock('news', 'No headlines yet', 'Populated as scheduler.py scans your watchlist - each ticker\'s news is fetched and sentiment-scored once per cycle.');
    return;
  }
  bodyEl.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>Ticker</th><th>Headline</th><th>Sentiment</th><th>Last Seen</th>
  </tr></thead><tbody>${items.map(n => `
    <tr>
      <td><b>${tickerLabel(n.ticker)}</b></td>
      <td>${(n.headline || "").replace(/</g,'&lt;')}</td>
      <td>${sentimentPill(n.sentiment_label)}</td>
      <td class="subtle">${fmtCST(n.last_seen_at)} CT</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* ============================== BOOT ============================== */
async function boot() {
  renderNav();
  renderBookToggle();
  await loadStatus();
  await loadTickerNames();
  await loadTickerHealth();
  connect();
  showTab("dashboard");
  setInterval(loadStatus, 10000);  // frequent enough that the cycle-running topbar badge/elapsed timer feels live
  setInterval(loadTickerNames, 300000);
  setInterval(loadTickerHealth, 300000);
  setInterval(() => { if (currentTab === "logs") loadLogsBody(); }, 10000);
  setInterval(() => { if (currentTab === "news") loadNewsBody(); }, 60000);
  if (typeof Notification !== "undefined" && Notification.permission === "default") {
    Notification.requestPermission();
  }
}
boot();
</script>
</body>
