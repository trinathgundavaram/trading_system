<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg-0: #0a0c11;
    --bg-1: #10131b;
    --bg-2: #151925;
    --bg-3: #1b2030;
    --border: #262c3d;
    --border-soft: #1e2330;
    --text-0: #eef0f6;
    --text-1: #aab0c4;
    --text-2: #6b7286;
    --blue: #5b8def;
    --blue-dim: #223050;
    --green: #34d399;
    --green-dim: #113228;
    --red: #f87171;
    --red-dim: #3a1a1e;
    --yellow: #fbbf24;
    --yellow-dim: #332608;
    --purple: #a78bfa;
    --purple-dim: #241f42;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-0);
    color: var(--text-0);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--blue); color: #fff; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  a { color: var(--blue); text-decoration: none; }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }

  /* ---------- App shell ---------- */
  #app { display: flex; min-height: 100vh; }

  #sidebar {
    width: 216px; flex-shrink: 0; background: var(--bg-1);
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    padding: 18px 12px; position: sticky; top: 0; height: 100vh;
  }
  #sidebar .brand {
    display: flex; align-items: center; gap: 9px; padding: 4px 8px 20px 8px;
  }
  #sidebar .brand .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0;
  }
  #sidebar .brand .name { font-weight: 650; font-size: 14px; letter-spacing: -0.2px; }
  #sidebar .brand .sub { font-size: 10px; color: var(--text-2); margin-top: 1px; }

  .navgroup { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: var(--radius-sm); color: var(--text-1); cursor: pointer;
    font-size: 12.5px; font-weight: 500; transition: background 0.12s, color 0.12s;
    -webkit-user-select: none; user-select: none;
  }
  .navitem svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
  .navitem:hover { background: var(--bg-2); color: var(--text-0); }
  .navitem.active { background: var(--blue-dim); color: #cddcff; }
  .navitem.active svg { opacity: 1; }

  #sidebar .spacer { flex: 1; }
  #sidebar .conn {
    display: flex; align-items: center; gap: 7px; padding: 9px 10px;
    border-radius: var(--radius-sm); background: var(--bg-2); font-size: 11px; color: var(--text-1);
  }
  #sidebar .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); flex-shrink: 0; }
  #sidebar .conn.live .dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }

  /* ---------- Main column ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #topbar {
    display: flex; align-items: center; gap: 10px; padding: 14px 26px;
    border-bottom: 1px solid var(--border-soft); flex-wrap: wrap;
    background: rgba(10,12,17,0.7); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 20;
  }
  #topbar h1 { font-size: 15px; font-weight: 650; letter-spacing: -0.2px; margin-right: 4px; }
  #topbar .fill { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .pill-blue   { background: var(--blue-dim);   color: #a9c3fb; border-color: #2c3f6b; }
  .pill-green  { background: var(--green-dim);  color: #7fe3bf; border-color: #1f5a44; }
  .pill-red    { background: var(--red-dim);    color: #ffb3b0; border-color: #6b2a2c; }
  .pill-yellow { background: var(--yellow-dim); color: #ffd873; border-color: #6b5417; }
  .pill-purple { background: var(--purple-dim); color: #cdb8ff; border-color: #4a3d80; }
  .pill-neutral{ background: var(--bg-3); color: var(--text-1); border-color: var(--border); }

  #content { padding: 22px 26px 60px 26px; max-width: 1320px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg-3); color: var(--text-0);
    cursor: pointer; transition: transform 0.06s, background 0.12s, border-color 0.12s;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn:hover { background: #232a3d; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-primary:hover { background: #4a7ee0; }
  .btn-success { background: var(--green); border-color: var(--green); color: #06281d; }
  .btn-success:hover { background: #2bc48d; }
  .btn-danger { background: var(--red-dim); border-color: #6b2a2c; color: #ffb3b0; }
  .btn-danger:hover { background: #4a2226; }
  .btn-danger.armed { background: var(--red); border-color: var(--red); color: #2a0505; animation: pulse 1.6s infinite; }
  .btn-ghost { background: transparent; border-color: var(--border); }
  .btn-sm { padding: 5px 10px; font-size: 11.5px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.75; } }

  /* ---------- Panels / cards ---------- */
  .grid { display: grid; gap: 16px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg-1); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 18px; margin-bottom: 16px;
  }
  .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .panel-head svg { width: 15px; height: 15px; color: var(--text-2); }
  .panel-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-2); font-weight: 650; }
  .panel-head .fill { flex: 1; }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .label { font-size: 10.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat .value { font-size: 20px; font-weight: 650; letter-spacing: -0.3px; }
  .stat .sub { font-size: 11px; color: var(--text-2); }

  .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 8px; margin: 12px 0 4px; }
  .metric { background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 9px 6px; text-align: center; }
  .metric-label { font-size: 9px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.3px; }
  .metric-value { font-size: 15px; font-weight: 650; margin-top: 3px; }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 34px 20px; color: var(--text-2); text-align: center;
  }
  .empty svg { width: 26px; height: 26px; opacity: 0.5; margin-bottom: 4px; }
  .empty .title { color: var(--text-1); font-weight: 600; font-size: 12.5px; }
  .empty .desc { font-size: 11.5px; max-width: 320px; }

  .banner {
    display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 16px; border: 1px solid;
  }
  .banner svg { width: 15px; height: 15px; flex-shrink: 0; }
  .banner-yellow { background: var(--yellow-dim); border-color: #6b5417; color: #ffd873; }
  .banner-red { background: var(--red-dim); border-color: #6b2a2c; color: #ffb3b0; }
  .banner-blue { background: var(--blue-dim); border-color: #2c3f6b; color: #a9c3fb; }

  /* ---------- Signal / position cards ---------- */
  .card-row { background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
              padding: 13px 14px; margin-bottom: 9px; border-left: 3px solid var(--border); }
  .card-row.buy { border-left-color: var(--green); }
  .card-row.sell { border-left-color: var(--red); }
  .card-row .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ticker { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { color: var(--text-2); padding: 8px 10px; text-align: left; font-weight: 600;
       font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border-soft); }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--bg-2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Generic table sort/filter (enhanceTable(), see script) ---------- */
  th.th-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.th-sortable:hover { color: var(--text-0); }
  th.th-sortable .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.35; font-size: 9px; }
  th.th-sortable.sort-active .sort-arrow { opacity: 1; color: var(--blue); }
  tr.col-filter-row td, tr.col-filter-row th {
    padding: 4px 6px; border-bottom: 1px solid var(--border); background: var(--bg-1);
  }
  tr.col-filter-row input[type=text], tr.col-filter-row select {
    width: 100%; box-sizing: border-box; background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text-0); border-radius: 5px; padding: 4px 6px; font-size: 11px; font-family: inherit; outline: none;
  }
  tr.col-filter-row input[type=text]:focus, tr.col-filter-row select:focus { border-color: var(--blue); }
  tr.col-filter-row input::placeholder { color: var(--text-2); }
  .table-controls-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .table-controls-row .clear-filters-link {
    font-size: 11px; color: var(--blue); cursor: pointer; text-decoration: none;
  }
  .table-controls-row .clear-filters-link:hover { text-decoration: underline; }
  .table-controls-row .filter-count { font-size: 11px; color: var(--text-2); }

  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral { color: var(--text-2); }

  /* ---------- Settings ---------- */
  .field { margin-bottom: 16px; }
  .field-label { font-size: 11.5px; font-weight: 650; color: var(--text-1); margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .field-desc { font-size: 11px; color: var(--text-2); margin-top: 5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .chip {
    display: flex; align-items: center; gap: 6px; background: var(--bg-3); border: 1px solid var(--border);
    padding: 5px 6px 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600;
  }
  .chip button {
    background: none; border: none; color: var(--text-2); cursor: pointer; padding: 2px;
    display: flex; align-items: center; border-radius: 50%; width: 18px; height: 18px; justify-content: center;
  }
  .chip button:hover { background: var(--red-dim); color: var(--red); }
  .chip button svg { width: 11px; height: 11px; }

  .add-row { display: flex; gap: 8px; }
  input[type=text], input[type=number] {
    background: var(--bg-2); border: 1px solid var(--border); color: var(--text-0);
    border-radius: var(--radius-sm); padding: 8px 11px; font-size: 12.5px; font-family: inherit;
    outline: none; transition: border-color 0.12s;
  }
  input[type=text]:focus, input[type=number]:focus { border-color: var(--blue); }
  input::placeholder { color: var(--text-2); }

  .segmented { display: inline-flex; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
  .segmented button {
    background: none; border: none; color: var(--text-1); padding: 7px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .segmented button.active { background: var(--blue); color: #fff; }
  .segmented button:not(.active):hover { background: var(--bg-3); }

  .risk-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 900px) { .risk-cards { grid-template-columns: repeat(2, 1fr); } }
  .risk-card {
    background: var(--bg-2); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 13px; cursor: pointer; transition: border-color 0.12s, background 0.12s;
  }
  .risk-card:hover { border-color: var(--text-2); }
  .risk-card.selected { border-color: var(--blue); background: var(--blue-dim); }
  .risk-card .name { font-weight: 700; font-size: 12.5px; margin-bottom: 8px; }
  .risk-card .kv { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-1); padding: 2px 0; }
  .risk-card .kv b { color: var(--text-0); font-weight: 600; }

  .danger-zone { border: 1px solid #4a2226; background: linear-gradient(180deg, var(--red-dim), var(--bg-1)); }

  /* ---------- Toast ---------- */
  #toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 16px; font-size: 12.5px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px;
    animation: toast-in 0.18s ease-out;
  }
  .toast.success { border-color: #1f5a44; }
  .toast.error { border-color: #6b2a2c; }
  .toast svg { width: 15px; height: 15px; flex-shrink: 0; }
  .toast.success svg { color: var(--green); }
  .toast.error svg { color: var(--red); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Modal ---------- */
  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(4,5,8,0.6); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 300;
  }
  #modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; width: 340px; box-shadow: var(--shadow);
  }
  .modal h3 { font-size: 14px; margin-bottom: 6px; }
  .modal p { font-size: 12px; color: var(--text-1); margin-bottom: 14px; }
  .modal input { width: 100%; margin-bottom: 14px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }

  .health-bar, .heat-track { height: 7px; border-radius: 4px; background: var(--bg-3); overflow: hidden; }
  .health-fill, .heat-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

  .subtle { color: var(--text-2); font-size: 11px; }

  /* Hoverable label/value with an explanatory native title tooltip - dotted
     underline is the visual cue that there's more info on hover. */
  .hint { border-bottom: 1px dotted var(--text-2); cursor: help; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="mark">T</div>
      <div>
        <div class="name">Trading Platform</div>
        <div class="sub">Decision support - no auto orders</div>
      </div>
    </div>
    <div class="navgroup" id="nav"></div>
    <div class="spacer"></div>
    <div class="conn" id="conn-pill"><span class="dot"></span><span id="conn-text">Connecting…</span></div>
  </div>

  <div id="main">
    <div id="topbar">
      <h1 id="page-title">Dashboard</h1>
      <span id="regime-badge" class="pill pill-neutral">Regime —</span>
      <span id="health-badge" class="pill pill-neutral">Health —</span>
      <span id="mode-badge" class="pill pill-blue">SWING</span>
      <span id="watch-badge" class="pill pill-yellow">WATCH</span>
      <span id="cycle-status-badge" class="pill pill-neutral" style="display:none;"></span>
      <div class="segmented" id="book-toggle" style="margin-left:6px;" title="Switches Dashboard, Positions, and Portfolio to show either the simulated (Paper) book or your real Robinhood/confirm_fill.py (Real) book - never both mixed together."></div>
      <div class="fill"></div>
      <button class="btn btn-primary btn-sm" id="copy-btn" onclick="copyPrompt()"></button>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<div id="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title">Enter auth token</h3>
    <p id="modal-desc">Matches the server's <code>UI_AUTH_TOKEN</code> (environment / <code>.env</code> / Keychain — no longer <code>config.yaml</code>). Saved locally so you won't be asked again on this browser.</p>
    <input type="text" id="modal-input" placeholder="auth token" autocomplete="off">
    <div class="row">
      <button class="btn btn-ghost btn-sm" onclick="closeModal(null)">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="closeModal(document.getElementById('modal-input').value)">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ============================== ICONS ============================== */
const ICON = {
  dashboard: '<path d="M3 13h8V3H3v10Zm10 8h8V3h-8v18ZM3 21h8v-6H3v6Z"/>',

  positions: '<path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/>',
  control: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
  performance: '<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
  learning: '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  risk: '<path d="M12 2 2 7v6c0 5.25 3.5 9.7 10 11 6.5-1.3 10-5.75 10-11V7l-10-5Z"/>',
  journal: '<path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M4 4v13a3 3 0 0 0 3 3"/><path d="M9 9h7M9 13h5"/>',
  monitor: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  power: '<path d="M12 2v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5h13.2l3.4 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6l3.4-7Z"/>',

// Inc.)"), when known (storage/database.py's ticker_info_cache - populated
// opportunistically during scan cycles and explicitly on watchlist
// validation). Falls back to the bare ticker if the name hasn't been seen
// yet. Also keeps the full name in a hover title in case it's long/truncated
// by surrounding layout.
function tickerLabel(t) {
  const name = tickerNames[t];

  const safe = name.replace(/"/g, '&quot;');
  return `<span title="${safe}">${t}</span> <span class="subtle" style="font-weight:400;">(${safe})</span>`;
}

async function copyPrompt() {
  try {
    const res = await authFetch("/api/prompt/copy", { method: "POST" });
    if (res.status === 403 || res.status === 429) return;   // authFetch already explained it
    if (res.status === 404) { toast("No prompt ready yet - runs after the first scheduler.py cycle", "alert"); return; }
    const data = await res.json();
    if (data.status === "copied") {
      toast("trade_prompt.md copied to clipboard");
    } else {

    }
  } catch (e) {

  }

/* ============================== TOASTS / MODAL ============================== */
function toast(msg, kind="success") {
  const wrap = document.getElementById("toast-wrap");
  const t = document.createElement("div");
  t.className = `toast ${kind}`;
  t.innerHTML = `${svg(kind==='success'?'check':'alert', 15)}<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .25s"; setTimeout(()=>t.remove(), 250); }, 2600);
}

let _modalResolve = null;
function askToken(title, desc) {
  return new Promise(resolve => {
    _modalResolve = resolve;
    document.getElementById("modal-title").textContent = title || "Enter auth token";
    document.getElementById("modal-desc").textContent = desc || "Matches the server's UI_AUTH_TOKEN (environment / .env / Keychain).";
    const input = document.getElementById("modal-input");
    input.value = localStorage.getItem(AUTH_TOKEN_KEY) || "";
    document.getElementById("modal-backdrop").classList.add("open");
    setTimeout(() => input.focus(), 30);
  });
}
function closeModal(value) {
  document.getElementById("modal-backdrop").classList.remove("open");
  if (_modalResolve) { _modalResolve(value); _modalResolve = null; }
}
async function getToken() {
  let t = localStorage.getItem(AUTH_TOKEN_KEY);
  if (t) return t;
  t = await askToken();
  if (t) localStorage.setItem(AUTH_TOKEN_KEY, t);
  return t;
}

/* Every write endpoint on the server requires the token (§4). This is the
   client-side mirror of server.py's require_token dependency: ONE place that
   attaches the header, so a new call site cannot forget it the way eight of
   them did before v1.1.1.

   Also centralises the two failure responses. A 403 clears the cached token
   so the next attempt re-prompts instead of silently failing forever with a
   stale value; a 429 is the per-client lockout, and says so rather than
   looking like a wrong password. */
async function authFetch(url, opts = {}) {
  const token = await getToken();
  // A JSON body, not null: several call sites go straight to .json(), and a
  // null body throws there instead of surfacing the real reason.
  if (!token) return new Response('{"detail":"no auth token provided"}',
                                   { status: 403, headers: { "Content-Type": "application/json" } });
  const headers = Object.assign({}, opts.headers || {}, { "X-Auth-Token": token });
  const r = await fetch(url, Object.assign({}, opts, { headers }));
  if (r.status === 403) {
    localStorage.removeItem(AUTH_TOKEN_KEY);
    toast("Invalid auth token", "error");
  } else if (r.status === 429) {
    toast("Too many failed attempts - locked out for 15 minutes", "error");
  }
  return r;
}

/* ============================== WEBSOCKET ============================== */
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById("conn-pill").classList.add("live");
    document.getElementById("conn-text").textContent = "Live";
  };
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "full_state" || data.type === "update") {
      Object.assign(state, data);
      renderHeader();
      if (currentTab === "dashboard") {
        renderDashboard(document.getElementById("content"));
      } else if (data.type === "full_state" && currentTab !== "control") {
        // full_state only arrives right when a WS (re)connects (see
        // server.py's /ws handler) - refresh whatever tab is open so a
        // dropped-then-restored connection doesn't leave stale data on
        // screen until the next manual tab switch (same "don't make me
        // refresh" goal as the cycle_complete handler below).
        loadTab(currentTab);
      }
    } else if (data.type === "event") {
      handleLiveEvent(data.event_type, data.payload);
    }
  };
  ws.onclose = () => {
    document.getElementById("conn-pill").classList.remove("live");
    document.getElementById("conn-text").textContent = "Reconnecting…";
    setTimeout(connect, 3000);
  };
  setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 30000);
}

/* ============================== LIVE EVENTS ============================== */
// Pushed by server.py's background poll of the ui_events table (written by
// scheduler.py - a separate process, see storage/database.py's ui_events
// schema comment). Bounded latency (~server.py's EVENT_POLL_SECONDS), not
// true push, but near-real-time without a new dependency.
async function handleLiveEvent(eventType, payload) {
  if (eventType === "buy_signal") {
    toast(`BUY candidate: ${tickerLabel(payload.ticker)} — score ${payload.pct_score.toFixed(0)}%`, "success");
    maybeDesktopNotify(`BUY candidate: ${tickerLabelText(payload.ticker)}`, `Score ${payload.pct_score.toFixed(0)}% | ${payload.regime || ""} regime`);
  } else if (eventType === "urgent_exit") {
    toast(`URGENT EXIT: ${tickerLabel(payload.ticker)} — ${payload.label}`, "alert");
    maybeDesktopNotify(`URGENT EXIT: ${tickerLabelText(payload.ticker)}`, payload.reason);
  } else if (eventType === "data_quality_alert") {
    toast(`${tickerLabel(payload.ticker)}: data stale for ${payload.consecutive_stale_cycles} cycles in a row (${(payload.stale_indicators||[]).join(", ")})`, "alert");
    await loadTickerHealth();
    if (currentTab === "control") loadTab("control");
    if (currentTab === "monitor") loadTab("monitor");
  } else if (eventType === "cycle_complete") {
    try {
      const fresh = await (await fetch("/api/state")).json();
      Object.assign(state, fresh);
      await loadStatus(); // market_open/last_cycle changed too - drops the "market closed" banner if a manual run just populated the board
      await loadTickerHealth();
      renderHeader();
      // Auto-refresh whichever tab is currently open, not just a fixed
      // subset - a full cycle can touch Performance/Learning/Strategy/Risk/
      // Journal/Monitor data too (weight changes, closed trades, learning
      // runs, alerts), not just dashboard/positions/signals. Skipped for
      // "control" specifically - it holds in-progress user input (the add-
      // ticker box, risk-level picker) that a forced re-render would wipe
      // out from under someone mid-edit; that tab's own targeted refreshes
      // (loadTickerHealth, etc.) still run independently.
      if (currentTab !== "control") {
        loadTab(currentTab);
      }
    } catch (e) { /* next poll will retry */ }
    if (payload && payload.triggered_by === "manual") {
      toast(`Manual cycle finished — ${payload.n_tickers} tickers, ${payload.n_buy} buy signal(s).`, "success");
    }
    document.querySelectorAll(".run-now-trigger").forEach(btn => {
      btn.disabled = false;
      btn.innerHTML = `${svg("refresh",13)}<span>Run cycle now</span>`;
    });
  }
}

// Browser Notification API - complements engine/notifications.py's macOS
// osascript notifications (which fire even if no browser tab is open at
// all). This one only makes sense when the tab is open but not focused, so
// it doesn't double-alert someone already looking at the toast.
function maybeDesktopNotify(title, body) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  if (!document.hidden) return;
  try { new Notification(title, { body }); } catch (e) { /* ignore */ }
}

async function loadStatus() {
  try { status = await (await fetch("/api/status")).json(); } catch (e) { status = {}; }
  renderCycleStatusBadge();  // topbar badge is visible on every tab - keep it live independent of which tab is open
  refreshCycleProgressSlots();
  refreshNextRunSlots();
}

// Persistent topbar indicator - visible on EVERY tab, not just Dashboard/
// Monitor's own banners - for "a cycle is running right now," whether it's
// scheduler.py's own cron-triggered run (a separate process) or a manual
// one from this UI. Backed by storage/database.py's cycle_status row via
// /api/status - see that table's schema comment for why an in-memory flag
// alone (server.py's _manual_cycle_lock) isn't enough.
function renderCycleStatusBadge() {
  const badge = document.getElementById("cycle-status-badge");
  if (!badge) return;
  if (!status.is_running) {
    badge.style.display = "none";
    return;
  }
  let elapsed = "";
  if (status.started_at) {
    const startedMs = new Date(/[Zz]|[+-]\d{2}:?\d{2}$/.test(status.started_at) ? status.started_at : status.started_at + "Z").getTime();
    const secs = Math.max(0, Math.round((Date.now() - startedMs) / 1000));
    elapsed = secs < 60 ? ` (${secs}s)` : ` (${Math.floor(secs / 60)}m ${secs % 60}s)`;
  }
  const label = status.triggered_by === "manual" ? "Manual cycle running" : "Cycle running";
  const pct = cycleProgressPct(status);
  badge.style.display = "";
  badge.className = "pill pill-blue";
  badge.innerHTML = `${svg("refresh", 12)} ${label} · ${pct}%${elapsed}`;
  badge.title = `${cycleStageText(status)}${status.started_at ? ` — started ${fmtCST(status.started_at)} CT` : ""}`;
}

// 2026-07-14: Trinath asked for a real 0-100% progress bar instead of just
// elapsed time - a cycle's total duration varies too much (watchlist size,
// screener on/off, MCP latency) to estimate a % from elapsed time alone, so
// this maps scheduler.py's real per-cycle STAGE (see storage/database.py's
// set_cycle_stage() docstring) to an approximate cumulative % band. Bands
// are grounded in the real cycle-timing breakdown from an earlier profiling
// pass this session (screener+setup ~55%, per-ticker scoring ~32%, finalize
// ~13% of a typical cycle) - approximate, not a literal per-item count,
// EXCEPT for ticker_analysis, which has a genuinely countable unit of work
// (N tickers) and uses the real tickers_done/tickers_total fraction within
// its band. Good enough to answer "is this moving or stuck," not meant as a
// precise ETA.
const CYCLE_STAGE_LABELS = {
  starting: "Starting cycle…",
  market_context: "Fetching market context",
  screener: "Running discovery screener",
  ticker_analysis: "Analyzing tickers",
  finalizing: "Finalizing (prompt + journal)",
};
const CYCLE_STAGE_BANDS = {
  starting: [0, 2],
  market_context: [2, 10],
  screener: [10, 40],
  ticker_analysis: [40, 90],
  finalizing: [90, 99],
};
function cycleProgressPct(s) {
  if (!s.is_running) return 0;
  const band = CYCLE_STAGE_BANDS[s.stage] || [0, 3];
  if (s.stage === "ticker_analysis" && s.tickers_total) {
    const frac = Math.max(0, Math.min(1, (s.tickers_done || 0) / s.tickers_total));
    return Math.round(band[0] + frac * (band[1] - band[0]));
  }
  return band[0];
}
function cycleStageText(s) {
  const label = CYCLE_STAGE_LABELS[s.stage] || "Running…";
  if (s.stage === "ticker_analysis" && s.tickers_total) {
    return `${label} (${s.tickers_done || 0}/${s.tickers_total})`;
  }
  return label;
}
// Shared markup so the Dashboard banner and Monitor tab's Scheduler Status
// panel never drift out of sync with each other - both just call this.
function cycleProgressBarHtml(s) {
  if (!s.is_running) return "";
  const pct = cycleProgressPct(s);
  return `<div style="margin-top:8px;max-width:420px;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-bottom:4px;">
      <span>${cycleStageText(s)}</span><span>${pct}%</span>
    </div>
    <div class="heat-track"><div class="heat-fill" style="width:${pct}%;background:var(--blue);"></div></div>
  </div>`;
}
// Re-renders just the progress-bar slot(s) currently in the DOM, called from
// loadStatus()'s 10s poll so the bar visibly advances without a full tab
// re-render (which would flicker and could wipe in-progress state on other
// tabs, e.g. Control's add-ticker box).

  const dash = document.getElementById("dashboard-cycle-progress");
  if (dash) dash.innerHTML = cycleProgressBarHtml(status);

}

// timeZone is required on every toLocaleString() call below - without it,
// rendering silently falls back to the BROWSER's local timezone, which may
// not match the label next to it. ET_TZ is still used for the couple of
// spots that are inherently exchange-hours-native (next_open_et is a real
// NYSE session boundary) - server.py's /api/status already returns that as
// a tz-aware ISO string (pytz "US/Eastern"), so `new Date(...)` parses it
// correctly regardless of which zone it's then displayed in.
const ET_TZ = "America/New_York";

// Trinath wants every timestamp in this UI shown in Central time, not raw
// UTC - see fmtCST() below for why that wasn't happening already.
const DISPLAY_TZ = "America/Chicago";

// Every timestamp column in storage/database.py is written via
// datetime.utcnow().isoformat() - a NAIVE UTC string with NO trailing "Z" or
// offset (e.g. "2026-07-14T12:08:23.456"). Per the ECMAScript Date Time
// String Format spec, a date-time string WITHOUT an offset is parsed as
// LOCAL BROWSER TIME, not UTC - and the old code didn't even call
// `new Date(...)` at all, it just string-sliced the raw value
// (`.slice(0,16).replace("T"," ")`), so every timestamp in this UI was
// silently showing raw UTC with no conversion and no timezone label at all.
// This appends "Z" (unless an offset is already present, e.g. next_open_et)
// before parsing, so the browser correctly treats it as UTC, then renders
// it in DISPLAY_TZ (Central) - this is the ONE place that logic lives; every
// timestamp render site below should go through this function.
function fmtCST(isoString, opts) {
  if (!isoString) return "—";
  const hasOffset = /[Zz]|[+-]\d{2}:?\d{2}$/.test(isoString);
  const d = new Date(hasOffset ? isoString : isoString + "Z");
  if (isNaN(d.getTime())) return isoString;
  return d.toLocaleString(undefined, Object.assign({
    timeZone: DISPLAY_TZ, month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }, opts || {}));
}

// 2026-07-14: Trinath asked why the UI never showed when the NEXT scan cycle
// would fire (as opposed to next_open_et, which is next MARKET open and only
// rendered while the market's closed). status.next_run_at comes straight from
// scheduler.py's own live APScheduler job object (see storage/database.py's
// set_next_cycle_time() docstring) via cycle_status - always render this,
// market open or not, since the cron schedule keeps firing through the whole
// 9:00-16:30 ET window regardless of market-open state.
function nextRunLine(status) {
  if (!status.next_run_at) {
    return `<div class="subtle" style="margin-top:6px;">Next scan cycle: — (scheduler.py not running, or hasn't started its first cycle yet)</div>`;
  }
  const target = new Date(status.next_run_at);
  if (isNaN(target.getTime())) {
    return `<div class="subtle" style="margin-top:6px;">Next scan cycle: ${status.next_run_at}</div>`;
  }
  const mins = Math.max(0, Math.round((target.getTime() - Date.now()) / 60000));
  const etaText = mins < 1 ? "due any moment" : mins === 1 ? "in ~1 min" : `in ~${mins} min`;
  return `<div class="subtle" style="margin-top:6px;">Next scan cycle: ${fmtCST(status.next_run_at, {second: undefined})} CT (${etaText})</div>`;
}

// "Kill a hung/long-running cycle" (2026-07-17, Akhil: "add a button or a
// way to kill a current run manually if it is hung or running longer").
// Backend support already existed (server.py's POST /api/cycle/cancel, added
// 2026-07-15) but had no UI control - this wires a button to it. Only shown
// while status.is_running is true; hidden the rest of the time so it can't
// be clicked against nothing.
// 2026-07-22 (Trinath: "cancel run should be able to do all this as well" -
// same as the new 15-min auto-kill): /api/cycle/cancel now force-kills the
// cycle's whole process group immediately (see engine/cycle_supervisor.py)
// instead of the old cooperative "wait for in-flight tickers to finish"
// behavior - this button now stops the run right away, not gradually.
function cancelRunBtnHtml() {
  if (!status.is_running) return "";
  const cancelling = !!status.cancel_requested;
  return `<button class="btn btn-sm btn-danger cancel-run-trigger" onclick="cancelCycleNow(event)" ${cancelling ? "disabled" : ""} title="Force-kill the current cycle immediately (process + every subprocess it spawned).">${svg("x",13)}<span>${cancelling ? "Cancelling…" : "Cancel run"}</span></button>`;
}

async function cancelCycleNow(evt) {
  const btn = evt ? evt.currentTarget : document.querySelector(".cancel-run-trigger");
  if (!btn) return;
  btn.disabled = true;
  btn.innerHTML = `${svg("x",13)}<span>Cancelling…</span>`;
  try {
    const res = await authFetch("/api/cycle/cancel", { method: "POST" });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      toast(`Couldn't cancel: ${body.detail || res.statusText}`, "error");
      btn.disabled = false;
      btn.innerHTML = `${svg("x",13)}<span>Cancel run</span>`;
      return;
    }
    const body = await res.json().catch(() => ({}));
    toast(body.note || "Cycle force-killed.", "info");
  } catch (e) {
    toast(`Couldn't reach the server: ${e.message}`, "error");
    btn.disabled = false;
    btn.innerHTML = `${svg("x",13)}<span>Cancel run</span>`;
  } finally {
    await loadStatus();
  }
}

// Called from any "Run cycle now" button (dashboard banner, Monitor tab) -
// keyed off event.currentTarget rather than a fixed element id so it works
// no matter which one was clicked, and works even if both happen to be in
// the DOM at once.
async function runCycleNow(evt) {
  const btn = evt ? evt.currentTarget : document.querySelector(".run-now-trigger");
  if (!btn) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `${svg("refresh",13)}<span>Starting…</span>`;
  try {
    const res = await authFetch("/api/cycle/run_now", { method: "POST" });
    if (res.status === 409) {
      toast("A manual cycle is already running - hang tight.", "info");
    } else if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      toast(`Couldn't start cycle: ${body.detail || res.statusText}`, "error");
    } else {
      toast("Cycle started - the dashboard will refresh automatically when it finishes.", "success");
      btn.innerHTML = `${svg("refresh",13)}<span>Running…</span>`;
      return; // stays disabled/"Running…" until the cycle_complete event resets it (see handleLiveEvent)
    }
  } catch (e) {
    toast(`Couldn't reach the server: ${e.message}`, "error");
  }
  btn.disabled = false;
  btn.innerHTML = original;
}

// Plain fetch()+.json() has no timeout - if a request stalls (server busy,
// network hiccup, a background job like the backtest hogging the process),
// the calling tab's render function just hangs on "Loading…" forever with
// no error, since none of them wrap the await in try/catch either. This
// wraps both problems: aborts after timeoutMs so a stuck request fails
// fast instead of silently, and always throws a normal Error the caller can
// catch (network failure, non-2xx status, or timeout all look the same to
// the caller).
async function fetchJSON(url, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error(`${url} -> HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error(`${url} timed out after ${timeoutMs / 1000}s`);
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// Progressively enhances every rendered <table> with click-to-sort headers and
// a per-column filter row, WITHOUT touching each of this file's 30+ individual
// table render call sites. It operates purely on the DOM after a table's HTML
// is already in place - reading/reordering/hiding <tr> elements a render
// function produced - so no render function's own markup needs to change.
// Wired up once via a MutationObserver on #content (every tab's render
// function replaces #content's descendants' innerHTML, which is exactly what
// that observes) rather than requiring a manual "enhance this table" call
// sprinkled into 30+ places - new tabs/tables get this for free.
//
// Row-GROUP aware: several tables pair a clickable "main" row with a hidden
// detail row (id="<prefix>-detail-<i>", toggled by toggleDetailRow() - see
// the Signals/Journal tabs). Those onclick handlers are baked in at render
// time against the ORIGINAL array index, not DOM position, so sorting must
// move a main row and its detail row(s) together as one unit, never
// independently, or expand/collapse desyncs. _buildRowGroups() below does
// that purely from the existing "-detail-" id naming convention - nothing
// else in the file needed to change to support it.
//
// Opt-outs: a whole table skips enhancement with `data-no-enhance` on the
// <table> tag; an individual column is skipped automatically whenever its
// header cell is empty (already true for every existing caret/expand-icon
// column, e.g. Signals/Journal's leading `<th></th>` - nothing to change
// there either).
const _TABLE_OBS_DEBOUNCE_MS = 150;
let _tableObsTimer = null;

function _isEmptyMarker(text) {
  const t = String(text == null ? '' : text).trim();
  return t === '' || t === '—' || t === '-' || t.toLowerCase() === 'n/a';
}

function _parseFilterNumeric(text) {
  if (_isEmptyMarker(text)) return null;
  const cleaned = String(text).trim().replace(/[$,%]/g, '').replace(/^\+/, '');
  const n = parseFloat(cleaned);
  return Number.isNaN(n) ? null : n;
}

function _buildRowGroups(tbody) {
  const groups = [];
  let current = null;
  Array.from(tbody.rows).forEach(tr => {
    const isDetail = tr.id && tr.id.indexOf('-detail-') !== -1;
    if (isDetail && current) {
      current.extra.push(tr);
    } else {
      current = { main: tr, extra: [] };
      groups.push(current);
    }
  });
  return groups;
}

function enhanceTable(table) {
  if (!table || table.dataset.enhanced || table.hasAttribute('data-no-enhance')) return;
  const thead = table.tHead, tbody = table.tBodies[0];
  if (!thead || !tbody || !thead.rows.length || !tbody.rows.length) return;
  const headerRow = thead.rows[0];
  const ths = Array.from(headerRow.cells);
  if (ths.length < 2) return; // not worth it for 0/1-column tables

  table.dataset.enhanced = "1";
  const groups = _buildRowGroups(tbody);
  const colCount = ths.length;

  // Per-column: mostly numeric-looking? what distinct values exist? (decides
  // text-input vs dropdown filter). Sampled from MAIN rows only - detail rows
  // (colspan'd breakdown panels) aren't tabular data to filter on.
  const colIsNumeric = new Array(colCount).fill(false);
  const colUniqueValues = new Array(colCount).fill(null).map(() => new Set());
  const colHasContent = new Array(colCount).fill(false);
  for (let c = 0; c < colCount; c++) {
    const headerText = (ths[c].textContent || '').trim();
    if (!headerText) continue; // empty header (caret/icon column) - never enhance
    let numericCount = 0, total = 0;
    groups.forEach(g => {
      const cell = g.main.cells[c];
      if (!cell) return;
      const txt = (cell.textContent || '').trim();
      // Placeholder/empty markers ("—", "still maturing" rows, etc.) don't
      // count toward the numeric-vs-text ratio sample at all - a column
      // that's numeric wherever it HAS a value shouldn't get pushed into
      // string-sort mode just because some rows are legitimately blank
      // (found via jsdom test: a 4-row fixture with one "—" pushed the
      // ratio to 0.75 < the 0.8 threshold, silently falling back to
      // lexicographic string sort - "+15.9%" sorting before "+2.3%"
      // because '1' < '2' as characters - wrong and actively misleading).
      if (_isEmptyMarker(txt)) return;
      total++;
      colHasContent[c] = true;
      if (_parseFilterNumeric(txt) !== null) numericCount++;
      colUniqueValues[c].add(txt);
    });
    colIsNumeric[c] = total > 0 && numericCount / total >= 0.8;
  }

  // ---- Sort ----
  let sortState = { col: -1, dir: 1 };
  function applySort() {
    if (sortState.col < 0) return;
    const c = sortState.col, dir = sortState.dir;
    const withVal = groups.map(g => {
      const cell = g.main.cells[c];
      const txt = cell ? (cell.textContent || '').trim() : '';
      const v = colIsNumeric[c] ? _parseFilterNumeric(txt) : txt.toLowerCase();
      const empty = v === null || v === '';
      return { g, v, empty };
    });
    withVal.sort((a, b) => {
      if (a.empty && b.empty) return 0;
      if (a.empty) return 1;   // empties always sort last, regardless of direction
      if (b.empty) return -1;
      if (colIsNumeric[c]) return dir * (a.v - b.v);
      return dir * (a.v < b.v ? -1 : a.v > b.v ? 1 : 0);
    });
    withVal.forEach(({ g }) => {
      tbody.appendChild(g.main);
      g.extra.forEach(e => tbody.appendChild(e));
    });
  }

  ths.forEach((th, c) => {
    const headerText = (th.textContent || '').trim();
    if (!headerText || !colHasContent[c]) return;
    th.classList.add('th-sortable');
    const arrow = document.createElement('span');
    arrow.className = 'sort-arrow';
    arrow.textContent = '▲';
    th.appendChild(arrow);
    th.addEventListener('click', () => {
      sortState = sortState.col === c ? { col: c, dir: sortState.dir * -1 } : { col: c, dir: 1 };
      ths.forEach((t2, c2) => {
        t2.classList.toggle('sort-active', c2 === sortState.col);
        const a2 = t2.querySelector('.sort-arrow');
        if (a2) a2.textContent = (c2 === sortState.col && sortState.dir === -1) ? '▼' : '▲';
      });
      applySort();
    });
  });

  // ---- Per-column filter row ----
  const filterRow = document.createElement('tr');
  filterRow.className = 'col-filter-row';
  const filters = new Array(colCount).fill('');

  function applyFilters() {
    let anyActive = false;
    groups.forEach(g => {
      let visible = true;
      for (let c = 0; c < colCount; c++) {
        if (!filters[c]) continue;
        anyActive = true;
        const cell = g.main.cells[c];
        const txt = cell ? (cell.textContent || '').trim().toLowerCase() : '';
        if (txt.indexOf(filters[c].toLowerCase()) === -1) { visible = false; break; }
      }
      g.main.style.display = visible ? '' : 'none';
      if (!visible) g.extra.forEach(e => { e.style.display = 'none'; });
    });
    if (table._clearFiltersLink) table._clearFiltersLink.style.display = anyActive ? '' : 'none';
  }

  let anyFilterable = false;
  ths.forEach((th, c) => {
    const headerText = (th.textContent || '').trim();
    const td = document.createElement('td');
    if (headerText && colHasContent[c]) {
      anyFilterable = true;
      const uniq = Array.from(colUniqueValues[c]);
      if (uniq.length > 1 && uniq.length <= 10) {
        const select = document.createElement('select');
        select.innerHTML = '<option value="">All</option>' + uniq.sort((a, b) => a.localeCompare(b))
          .map(v => `<option value="${v.replace(/"/g, '&quot;')}">${v}</option>`).join('');
        select.addEventListener('change', () => { filters[c] = select.value; applyFilters(); });
        td.appendChild(select);
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Filter…';
        let debounce;
        input.addEventListener('input', () => {
          clearTimeout(debounce);
          debounce = setTimeout(() => { filters[c] = input.value.trim(); applyFilters(); }, 150);
        });
        td.appendChild(input);
      }
    }
    filterRow.appendChild(td);
  });
  thead.appendChild(filterRow);

  // ---- "Clear filters" link, injected directly above the table ----
  if (anyFilterable) {
    const controls = document.createElement('div');
    controls.className = 'table-controls-row';
    const link = document.createElement('a');
    link.href = '#';
    link.className = 'clear-filters-link';
    link.textContent = 'Clear filters';
    link.style.display = 'none';
    link.addEventListener('click', (e) => {
      e.preventDefault();
      filters.fill('');
      filterRow.querySelectorAll('input').forEach(i => { i.value = ''; });
      filterRow.querySelectorAll('select').forEach(s => { s.value = ''; });
      applyFilters();
    });
    controls.appendChild(link);
    table._clearFiltersLink = link;
    table.parentElement.insertBefore(controls, table);
  }
}

function enhanceAllTables() {
  document.querySelectorAll('#content table:not([data-enhanced])').forEach(enhanceTable);
}

(function () {
  const root = document.getElementById('content');
  if (!root) return;
  const observer = new MutationObserver(() => {
    clearTimeout(_tableObsTimer);
    _tableObsTimer = setTimeout(enhanceAllTables, _TABLE_OBS_DEBOUNCE_MS);
  });
  observer.observe(root, { childList: true, subtree: true });
})();

/* ============================== SIGNALS TAB ============================== */
let _signalsCache = [];

async function renderSignalsTab(el) {
  el.innerHTML = `<div class="panel"><div class="panel-head">${svg('signals',15)}<span class="panel-title">Signal History</span></div><div id="signals-body">Loading…</div></div>`;
  const body = document.getElementById("signals-body");
  let signals;
  try {
    signals = await fetchJSON("/api/signals?limit=100");
  } catch (e) {
    body.innerHTML = tabErrorHTML(e);
    return;
  }
  _signalsCache = signals;
  if (!signals.length) { body.innerHTML = emptyBlock('inbox','No signals logged yet','Runs after the first scheduler.py cycle.'); return; }
  body.innerHTML = `<p class="field-desc" style="margin-bottom:10px;">Click a row to see the bucket/rule breakdown behind that score.</p>
    <div class="table-wrap"><table><thead><tr>
      <th></th><th>Time</th><th>Ticker</th><th>Signal</th><th>${withTip('Mode', 'trade_mode')}</th><th class="num">Score</th><th>Data Quality</th><th>Detail</th>
    </tr></thead><tbody>${signals.map((s, i) => `
      <tr class="signal-row" style="cursor:pointer;" onclick="toggleDetailRow('signal', ${i})">
        <td class="subtle"><span id="signal-caret-${i}" style="display:inline-block;transition:transform .15s;">${svg('chevron', 12)}</span></td>
        <td class="subtle">${fmtCST(s.timestamp)}</td>
        <td><b>${s.ticker?tickerLabel(s.ticker):"—"}</b></td>
        <td><span class="pill ${s.signal==='BUY'?'pill-green':s.signal==='SELL'?'pill-red':'pill-neutral'}">${s.signal}</span></td>
        <td>${modePill(s.trade_mode)}</td>
        <td class="num">${scoreCellText(s)}</td>
        <td class="subtle">${s.data_quality||"—"}</td>
        <td class="subtle">${s.sell_reason||(s.rules_failed&&s.rules_failed[0]?s.rules_failed[0].detail:"")}</td>
      </tr>
      <tr id="signal-detail-${i}" style="display:none;"><td colspan="8">${renderSignalDetail(s)}</td></tr>
      `).join("")}</tbody></table></div>`;
}

function toggleDetailRow(prefix, i) {
  const row = document.getElementById(`${prefix}-detail-${i}`);
  const caret = document.getElementById(`${prefix}-caret-${i}`);
  const open = row.style.display !== "none";
  row.style.display = open ? "none" : "table-row";
  caret.style.transform = open ? "" : "rotate(90deg)";
}

// A hard-vetoed or already-open ticker never reaches rules/swing_buy_rules.py's
// score() at all - its BuyResultCompat always carries pct_score=0 as a
// PLACEHOLDER (see rules/swing_buy_rules.py's from_veto()/already_open()),
// not a real "the system scored this at 0%" result. Showing "0%" for that
// case reads as a real score when it's actually "never scored" - this
// distinguishes the two using bucket_scores' presence (only populated when
// scoring genuinely ran).
function scoreCellText(s) {
  if (s.bucket_scores && s.bucket_scores.length) {
    return `${(s.buy_pct || 0).toFixed(0)}%`;
  }
  const failedFirst = s.rules_failed && s.rules_failed[0];
  if (failedFirst && failedFirst.name === "ALREADY_OPEN") return "holding";
  if (failedFirst) return "not scored";
  return `${(s.buy_pct || 0).toFixed(0)}%`;
}

// Compact bucket-score table: X.X / Y.Y contribution format per bucket,
// sorted qualified-first. Progress bar fills proportional to pct_of_own_max
// (how much of the bucket's own ceiling was reached) so the visual shows
// where the work is, not just the composite contribution.
function renderBucketScores(bucketScores) {
  if (!bucketScores || !bucketScores.length) return "";
  // Sort: qualified (highest contribution first), then unqualified (worst first)
  const sorted = [...bucketScores].sort((a, b) => {
    if (a.qualified !== b.qualified) return a.qualified ? -1 : 1;
    const aPct = a.max_points ? a.points / a.max_points : 0;
    const bPct = b.max_points ? b.points / b.max_points : 0;
    return a.qualified ? bPct - aPct : aPct - bPct;
  });
  return `<div style="display:grid;gap:6px;">` + sorted.map(b => {
    const pctOfMax = b.max_points ? Math.min(100, (b.points / b.max_points) * 100) : 0;
    const contribution = b.max_points ? (b.points / b.max_points) * b.weight * (b.qual_mult ?? 1) * 100 : 0;
    const maxContrib = b.weight * 100;
    const needPct = (b.min_pct * 100).toFixed(0);

    // VOLATILITY_EXPANSION is a bonus-only bucket (min_pct=0): ✔/✘ is
    // meaningless noise. When 0 pts: show neutral dash + "no signal" badge.
    // When it DID score: show ✔ + pts to celebrate the bonus.
    const isVolatility = b.name === "VOLATILITY_EXPANSION";
    const isVolatilityNeutral = isVolatility && b.points === 0;

    let mark, markColor, qualBadge;
    if (isVolatilityNeutral) {
      mark = '–';
      markColor = 'var(--text-muted)';
      qualBadge = `<span class="pill" style="padding:1px 5px;font-size:10px;background:var(--bg-subtle);color:var(--text-muted);">no signal</span>`;
    } else if (isVolatility) {
      mark = '✔';
      markColor = 'var(--green)';
      qualBadge = `<span class="pill pill-green" style="padding:1px 5px;font-size:10px;">bonus</span>`;
    } else {
      mark = b.qualified ? '✔' : '✘';
      markColor = b.qualified ? 'var(--green)' : 'var(--red)';
      qualBadge = b.qualified
        ? withTip(`<span class="pill pill-green" style="padding:1px 5px;font-size:10px;">qualified</span>`, 'bucket_qualify')
        : withTip(`<span class="pill pill-red" style="padding:1px 5px;font-size:10px;">needs ${needPct}%</span>`, 'bucket_qualify');
    }

    const barColor = isVolatilityNeutral ? 'var(--text-muted)' : (b.qualified ? 'var(--green)' : 'var(--red)');
    const rulesFired = b.rules_fired && b.rules_fired.length
      ? `<div class="subtle" style="margin-top:2px;font-size:10px;">${b.rules_fired.map(r=>`<code>${r}</code>`).join(' ')}</div>`
      : '';
    return `<div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
        <span style="color:${markColor};font-size:13px;line-height:1;">${mark}</span>
        <span style="font-size:12px;font-weight:600;flex:1;">${b.name}</span>
        <span style="font-size:12px;font-variant-numeric:tabular-nums;">
          ${withTip(`<b>${contribution.toFixed(1)}</b> <span class="subtle">/ ${maxContrib.toFixed(0)} pts</span>`, 'bucket_weight')}
        </span>
        ${qualBadge}
      </div>
      <div class="heat-track"><div class="heat-fill" style="width:${pctOfMax}%;background:${barColor}"></div></div>
      ${rulesFired}
    </div>`;
  }).join("") + `</div>`;
}

// Human-readable reason a bucket failed, mirroring packet_builder.py's _BUCKET_REASONS.
// Used by explainSignalPlainEnglish() when the score is far from the threshold.
const BUCKET_REJECTION_REASONS = {
  TREND:                { zero: "No trend established", weak: "Trend weak / mixed", close: "Trend partially established" },
  MOMENTUM:             { zero: "Momentum absent", weak: "Momentum weak", close: "Momentum building but not yet there" },
  VOLUME_PA:            { zero: "No volume/price-action confirmation", weak: "Volume/price action below threshold", close: "Volume/price action close to qualifying" },
  EXTERNAL:             { zero: "No positive external catalysts detected (analyst upgrade, insider buying, unusual options)", weak: "External signals thin — only absence-of-bad-news, no positive confirmation", close: "External confirmation partial — one positive signal but not enough" },
  SENTIMENT_MACRO:      { zero: "Sentiment/macro unfavorable", weak: "Sentiment/macro headwinds", close: "Sentiment/macro mixed" },
  MARKET_BREADTH:       { zero: "Market breadth weak — not supporting new buys", weak: "Breadth below threshold", close: "Breadth borderline" },
  VOLATILITY_EXPANSION: { zero: "No volatility compression signal", weak: "Volatility compression partial", close: "Near a volatility expansion setup" },
};
function bucketRejectionReason(b) {
  const pctOfMax = b.max_points ? b.points / b.max_points : 0;
  const tier = pctOfMax === 0 ? "zero" : (b.min_pct > 0 && pctOfMax >= b.min_pct * 0.75 ? "close" : "weak");
  return (BUCKET_REJECTION_REASONS[b.name] || {})[tier] || `${b.name} did not qualify`;
}

// Plain-English summary of WHY a signal came out BUY / SELL / HOLD, built
// purely from fields /api/signals already returns (bucket_scores,
// threshold_breakdown, rules_failed, sell_triggered_rule/sell_reason,
// ev_result, execution_quality, asset_class) - no extra API call. Meant to
// read like a sentence a non-technical person could follow, sitting ABOVE
// the existing detailed bucket/rule breakdown, not replacing it.
function explainSignalPlainEnglish(s) {
  const buckets = s.bucket_scores || [];
  const qualified = buckets.filter(b => b.qualified);
  const unqualified = buckets.filter(b => !b.qualified);
  const scorePct = s.buy_pct;
  const threshold = s.threshold_breakdown ? s.threshold_breakdown.final_threshold : null;
  const failedFirst = (s.rules_failed && s.rules_failed[0]) || null;

  const pd = s.probabilistic_decision;

  if (s.signal === "BUY") {
    let out = `<b>BUY</b> — `;
    // 2026-07-15: whenever the pattern DB had enough history, THIS is the
    // real reason - probability of success + expected value, not the score/
    // threshold cliff. Lead with it; the score-vs-threshold sentence below
    // becomes supporting detail, not the primary reason, in that case.
    if (pd && pd.mode === "probabilistic") {
      out += `${pd.headline} `;
    }
    if (buckets.length) {
      out += `${qualified.length} of ${buckets.length} scoring categories qualified`;
      out += qualified.length ? ` (${qualified.map(b => b.name).join(", ")}). ` : `. `;
    }
    if (scorePct != null && threshold != null) {
      const margin = scorePct - threshold;
      out += pd && pd.mode === "probabilistic"
        ? `Score was ${scorePct.toFixed(1)}% vs. a ${threshold.toFixed(0)}% score-based threshold (informational only here — the probabilistic method above made the actual call). `
        : `The overall score (${scorePct.toFixed(1)}%) cleared the ${threshold.toFixed(0)}% threshold required under current market conditions${margin >= 0 ? ` by ${margin.toFixed(1)} points. ` : `. `}`;
    }
    if (s.ev_result && s.ev_result.ev != null && !(pd && pd.mode === "probabilistic")) {
      out += `Similar historical setups have shown a ${s.ev_result.ev >= 0 ? "+" : ""}${s.ev_result.ev.toFixed(1)}% expected outcome`;
      out += s.ev_result.confidence_level ? ` (${s.ev_result.confidence_level} confidence). ` : `. `;
    }
    if (s.asset_class === "ETF") out += `Scored with the ETF weight profile (less weight on company-specific factors, more on trend/breadth). `;
    if (s.execution_quality && s.execution_quality.tier) out += `Execution quality: ${s.execution_quality.tier.toLowerCase()}. `;
    return out;
  }

  if (s.signal === "SELL") {
    let out = `<b>SELL</b> — `;
    if (s.sell_triggered_rule) {
      out += `triggered by the <b>${s.sell_triggered_rule}</b> rule${s.sell_reason ? ` (${s.sell_reason})` : ""}. `;
      const extra = sellRuleExplainer(s.sell_triggered_rule);
      if (extra) out += extra + " ";
    } else {
      out += `an exit condition was met this cycle — see the detail below for specifics. `;
    }
    return out;
  }

  // HOLD - two very different situations share this label: "no buy" (a
  // candidate that didn't qualify) vs "no sell" (an open position that's
  // being kept). Distinguished via rules_failed[0].name === "ALREADY_OPEN"
  // (see rules/swing_buy_rules.py's already_open()).
  if (failedFirst && failedFirst.name === "ALREADY_OPEN") {
    return `<b>HOLD (no sell)</b> — already holding this position; it wasn't re-evaluated as a new entry. ` +
           `Exit conditions weren't met this cycle — see the Positions tab for its live Exit Score and stop price.`;
  }

  // HOLD (no buy) — two modes depending on how far the score missed.
  // Far miss (>25 pts short): skip threshold formula; show human rejection reasons.
  // Near miss (≤25 pts): show score vs threshold with bucket detail.
  const short = (scorePct != null && threshold != null) ? threshold - scorePct : null;
  const farMiss = short !== null && short > 25;

  if (pd && pd.mode === "probabilistic" && !pd.should_buy) {
    // Pattern-DB override path — always show the probabilistic reasoning
    let out = `<b>HOLD (no buy)</b> — ${pd.headline} `;
    out += `That didn't clear the ${(pd.min_win_probability*100).toFixed(0)}% win-probability / +${pd.min_ev_pct.toFixed(1)}% EV bar required to buy.`;
    return out;
  }

  if (farMiss && buckets.length) {
    // Score is so low the threshold detail is noise — show WHY instead.
    const failedBuckets = unqualified.filter(b => b.min_pct > 0)
      .sort((a, b) => (a.max_points ? a.points/a.max_points : 0) - (b.max_points ? b.points/b.max_points : 0));
    let out = `<b>HOLD (no buy)</b> — score ${scorePct.toFixed(1)}% is ${short.toFixed(0)} pts below the ${threshold.toFixed(0)}% threshold.<br><br>`;
    out += `<b>Bucket contributions:</b><br>`;
    // Compact table: mark ✔/✘, name, X.X / Y.Y pts
    const sortedB = [...buckets].sort((a, b) => {
      if (a.qualified !== b.qualified) return a.qualified ? -1 : 1;
      const aPct = a.max_points ? a.points/a.max_points : 0;
      const bPct = b.max_points ? b.points/b.max_points : 0;
      return a.qualified ? bPct - aPct : aPct - bPct;
    });
    out += `<div style="display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;font-size:12px;margin:6px 0 10px 0;font-variant-numeric:tabular-nums;">`;
    for (const b of sortedB) {
      const contrib = b.max_points ? (b.points/b.max_points) * b.weight * (b.qual_mult ?? 1) * 100 : 0;
      const maxC = b.weight * 100;
      // VOLATILITY_EXPANSION at 0 pts = neutral bonus bucket, not a failure
      const isVolNeutral = b.name === "VOLATILITY_EXPANSION" && b.points === 0;
      const color = isVolNeutral ? 'var(--text-muted)' : (b.qualified ? 'var(--green)' : 'var(--red)');
      const mark = isVolNeutral ? '–' : (b.qualified ? '✔' : '✘');
      out += `<span style="color:${color}">${mark}</span>`;
      out += `<span style="color:${isVolNeutral ? 'var(--text-muted)' : (b.qualified ? 'inherit' : 'var(--text-muted)')}">${b.name}</span>`;
      out += `<span style="color:${isVolNeutral ? 'var(--text-muted)' : (b.qualified ? 'inherit' : 'var(--text-muted)')}">${contrib.toFixed(1)} / ${maxC.toFixed(0)}</span>`;
    }
    out += `</div>`;
    if (failedBuckets.length) {
      out += `<b>Why the score is low:</b><br>`;
      out += `<ul style="margin:4px 0 0 0;padding-left:18px;">`;
      for (const b of failedBuckets) {
        out += `<li>${bucketRejectionReason(b)}</li>`;
      }
      // Pattern-DB availability
      const pdFallback = pd && pd.mode !== "probabilistic";
      if (pdFallback) {
        const n = (pd && pd.n_matches) || 0;
        out += `<li>Historical evidence: Unavailable (pattern database: ${n} similar trades)</li>`;
      }
      out += `</ul>`;
    }
    return out;
  }

  // Near miss — show score vs threshold with a brief weakest-area callout
  let out = `<b>HOLD (no buy)</b> — `;
  if (buckets.length && scorePct != null && threshold != null) {
    out += `the setup scored ${scorePct.toFixed(1)}%, `;
    out += short > 0
      ? `short of the ${threshold.toFixed(0)}% threshold by ${short.toFixed(1)} pt${short.toFixed(1) === "1.0" ? "" : "s"}. `
      : `at or above the threshold, but the buy condition wasn't otherwise met. `;
    if (unqualified.length) {
      const worst = unqualified.slice().sort((a, b) =>
        (a.max_points ? a.points / a.max_points : 0) - (b.max_points ? b.points / b.max_points : 0)
      )[0];
      out += `<b>${worst.name}</b> was the weakest area — ${bucketRejectionReason(worst)}. `;
    }
  } else if (failedFirst) {
    out += `it was screened out before scoring ran — ${failedFirst.detail}. `;
  } else {
    out += `no detailed breakdown was recorded for this signal (likely logged before this feature was added). `;
  }
  return out;
}

// 2026-07-15: the actual decision basis whenever the pattern DB had enough
// similar closed trades to trust a probability estimate (rules/
// probabilistic_decision.py) - P(win), P(>target% gain), P(stop-loss range
// loss), expected return/drawdown/hold, and the EV formula itself, in the
// same "metric" tile style used elsewhere in this UI (e.g. the News tab's
// mood panel). Returns "" when this signal predates the migration or never
// reached scoring (vetoed/already-open) - renderSignalDetail skips it then.
function renderProbabilisticDecisionPanel(s) {
  const pd = s.probabilistic_decision;
  if (!pd) return "";

  if (pd.mode !== "probabilistic") {
    return `<div style="background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;">
      <div class="field-label" style="margin-bottom:4px;">Probabilistic decision</div>
      <p class="field-desc" style="margin-top:0;">Score-based fallback — ${pd.reason || "not enough pattern-database history yet for this setup."}</p>
    </div>`;
  }

  const pWin = (pd.probability_of_success || 0) * 100;
  const pTarget = (pd.p_target_gain || 0) * 100;
  const pStop = (pd.p_stop_loss || 0) * 100;
  const ev = pd.expected_value_pct || 0;
  const evColor = ev >= 0 ? "var(--green)" : "var(--red)";
  const holdText = pd.expected_hold_hours != null ? `${pd.expected_hold_hours.toFixed(0)}h (~${(pd.expected_hold_hours/24).toFixed(1)}d)` : "—";

  return `<div style="background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;">
    <div class="field-label" style="margin-bottom:4px;">Probabilistic decision</div>
    <p class="field-desc" style="font-size:12.5px;line-height:1.5;color:var(--text-1);margin-top:0;margin-bottom:8px;"><b>${pd.headline}</b></p>
    <div class="metrics-row">
      <div class="metric"><div class="metric-label">P(win)</div><div class="metric-value">${pWin.toFixed(0)}%</div></div>
      <div class="metric"><div class="metric-label">P(&gt;${(pd.target_gain_pct||5).toFixed(0)}% gain)</div><div class="metric-value">${pTarget.toFixed(0)}%</div></div>
      <div class="metric"><div class="metric-label">P(stop-loss loss)</div><div class="metric-value">${pStop.toFixed(0)}%</div></div>
      <div class="metric"><div class="metric-label">Expected Value</div><div class="metric-value" style="color:${evColor};">${ev>=0?'+':''}${ev.toFixed(1)}%</div></div>
    </div>
    <div class="metrics-row" style="margin-top:8px;">
      <div class="metric"><div class="metric-label">Expected return</div><div class="metric-value">${(pd.expected_return_pct||0)>=0?'+':''}${(pd.expected_return_pct||0).toFixed(1)}%</div></div>
      <div class="metric"><div class="metric-label">Expected drawdown</div><div class="metric-value">${(pd.expected_drawdown_pct||0).toFixed(1)}%</div></div>
      <div class="metric"><div class="metric-label">Expected hold</div><div class="metric-value" style="font-size:13px;">${holdText}</div></div>
    </div>
    <div class="subtle" style="margin-top:8px;">Based on ${pd.n_matches} historically similar closed trades (confidence: ${pd.confidence}). P(stop-loss loss) and expected drawdown are proxies from where similar trades' price ended up at exit, not real intraday tracking — see engine/ev_engine.py's HONESTY NOTE.</div>
    ${pd.threshold_would_have_passed !== pd.should_buy ? `<div class="subtle" style="margin-top:4px;color:var(--yellow);">The old score-vs-threshold method would have said ${pd.threshold_would_have_passed ? "PASS" : "FAIL"} here — this method overrode it.</div>` : ""}
  </div>`;
}

function renderSignalDetail(s) {
  const parts = [];

  parts.push(`<div style="background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;">
    <div class="field-label" style="margin-bottom:4px;">In plain English</div>
    <p class="field-desc" style="font-size:12.5px;line-height:1.5;color:var(--text-1);margin-top:0;">${explainSignalPlainEnglish(s)}</p>
  </div>`);

  parts.push(renderProbabilisticDecisionPanel(s));

  if (s.bucket_scores && s.bucket_scores.length) {
    // Score header above the bucket table — mirrors packet_builder.py's RULES ENGINE header
    const threshold = s.threshold_breakdown ? s.threshold_breakdown.final_threshold : null;
    const scorePct = s.buy_pct;
    const short = (scorePct != null && threshold != null && s.signal !== "BUY") ? threshold - scorePct : null;
    const farMiss = short !== null && short > 25;
    if (scorePct != null && threshold != null) {
      const verdict = s.signal === "BUY"
        ? `<span style="color:var(--green);">PASS ✔</span>`
        : `<span style="color:var(--red);">FAIL — ${short != null ? short.toFixed(0) + ' pts short' : ''}</span>`;
      parts.push(`<div style="font-size:12px;margin-bottom:8px;">
        Score <b>${scorePct.toFixed(1)}%</b> · Threshold <b>${threshold.toFixed(0)}%</b> · ${verdict}
        ${!farMiss && s.threshold_breakdown ? `<div class="subtle" style="font-size:11px;margin-top:2px;">${s.threshold_breakdown.breakdown}</div>` : ''}
      </div>`);
    }
    parts.push(`<div class="field-label" style="margin-bottom:6px;">Bucket breakdown</div>`);
    parts.push(renderBucketScores(s.bucket_scores));
  } else if (s.rules_failed && s.rules_failed.length) {
    parts.push(`<div class="field-label" style="margin-bottom:6px;">Not scored</div>`);
    parts.push(`<p class="field-desc">${s.rules_failed.map(r => `<b>${r.name}</b>: ${r.detail}`).join('<br>')}</p>`);
  } else {
    parts.push(`<p class="field-desc">No rule breakdown recorded for this signal (logged before this feature was added).</p>`);
  }

  if (s.sell_triggered_rule) {
    parts.push(`<div class="field-label" style="margin-top:14px;margin-bottom:4px;">Sell rule triggered</div>`);
    parts.push(`<p class="field-desc"><b>${s.sell_triggered_rule}</b>: ${s.sell_reason||''}</p>`);
    parts.push(`<p class="field-desc">${sellRuleExplainer(s.sell_triggered_rule)}</p>`);
  }

  return `<div style="padding:12px 4px 16px 34px;">${parts.join("")}</div>`;
}

// WATCH-mode paper portfolio (engine/paper_trader.py): purse, equity curve,
// per-trade P&L ledger, and aggregate win/loss stats.
const fmtUSD = v => (v == null ? "—" : (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2));
const pnlClass = v => (v || 0) >= 0 ? "positive" : "negative";

// Which trading mode (SWING/DAY/HYBRID) was active when the buy was made -
// stamped on every position and ledger row (positions.trade_mode /
// paper_trades.trade_mode). SEED = cloned from the real book at purse start.
const _MODE_COLORS = { SWING: "var(--green)", DAY: "var(--yellow)", HYBRID: "var(--blue, #4a9eff)", SEED: "var(--text-2)" };
function modePill(mode) {
  if (!mode) return '<span class="subtle">—</span>';
  const m = mode.toUpperCase();
  const c = _MODE_COLORS[m] || "var(--text-2)";
  return `<span class="pill pill-neutral" style="border-color:${c};color:${c};" title="Trading mode active when this buy was made (trading.mode in config.yaml at signal time). SEED = position cloned from your real book when the paper purse was created.">${m}</span>`;
}

function equityCurveSVG(points, startingCash, width = 860, height = 190) {
  if (!points || points.length < 2) {
    return `<div class="subtle" style="padding:14px 0;">The equity curve appears after two or more WATCH-mode cycles have recorded portfolio snapshots.</div>`;
  }
  // Time-scaled x-axis (2026-07-16 graph fix): points were previously spaced
  // by INDEX, so a 90-minute hang followed by three quick cycles rendered as
  // four evenly-spaced dots - visually lying about when value changed.
  const ts = points.map(p => new Date(p.timestamp + "Z").getTime());
  const t0 = ts[0], t1 = ts[ts.length - 1] || t0 + 1;
  const span = Math.max(t1 - t0, 1);
  const vals = points.map(p => p.total_value);
  // y-domain includes the starting-cash baseline so "flat at start value"
  // and "hasn't moved because prices were stale" look different, with a
  // minimum band of ±0.5% so near-flat data doesn't explode tiny noise.
  const base = startingCash || vals[0];
  let min = Math.min(...vals, base), max = Math.max(...vals, base);
  const minBand = base * 0.005;
  if (max - min < minBand * 2) { min -= minBand; max += minBand; }
  const pad = (max - min) * 0.10;
  const lo = min - pad, hi = max + pad;
  const X0 = 56, X1 = width - 12, Y0 = height - 26, Y1 = 12;
  const x = t => X0 + ((t - t0) / span) * (X1 - X0);
  const y = v => Y0 - ((v - lo) / (hi - lo)) * (Y0 - Y1);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(ts[i]).toFixed(1)},${y(p.total_value).toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  const up = last.total_value >= base;
  const color = up ? "var(--green)" : "var(--red)";
  const area = `${path} L${x(t1).toFixed(1)},${Y0} L${x(t0).toFixed(1)},${Y0} Z`;
  const gridLines = [0.25, 0.5, 0.75].map(f => {
    const gy = Y0 - f * (Y0 - Y1);
    const gv = lo + f * (hi - lo);
    return `<line x1="${X0}" y1="${gy}" x2="${X1}" y2="${gy}" stroke="var(--border)" stroke-dasharray="3,4" stroke-width="1"/>
            <text x="${X0 - 6}" y="${gy + 3}" text-anchor="end" font-size="9" fill="var(--text-2)">$${gv.toFixed(2)}</text>`;
  }).join("");
  const baseY = y(base);
  const baseline = (baseY >= Y1 && baseY <= Y0) ? `
    <line x1="${X0}" y1="${baseY}" x2="${X1}" y2="${baseY}" stroke="var(--text-2)" stroke-dasharray="6,4" stroke-width="1" opacity="0.6"/>
    <text x="${X1}" y="${baseY - 4}" text-anchor="end" font-size="9" fill="var(--text-2)">start $${base.toFixed(0)}</text>` : "";
  // time ticks: first, ~1/3, ~2/3, last
  const ticks = [0, 0.33, 0.66, 1].map(f => {
    const t = t0 + f * span;
    return `<text x="${x(t)}" y="${height - 8}" text-anchor="${f === 0 ? 'start' : f === 1 ? 'end' : 'middle'}" font-size="9" fill="var(--text-2)">${fmtCST(new Date(t).toISOString())}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">
    ${gridLines}${baseline}
    <path d="${area}" fill="${color}" opacity="0.08"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.8"/>
    ${points.map((p, i) => `<circle cx="${x(ts[i]).toFixed(1)}" cy="${y(p.total_value).toFixed(1)}" r="2" fill="${color}" opacity="0.6"><title>${fmtCST(p.timestamp)} — $${p.total_value?.toFixed(2)} (cash $${p.cash?.toFixed(2)}, ${p.n_open} open)</title></circle>`).join("")}
    <circle cx="${x(t1)}" cy="${y(last.total_value)}" r="3.5" fill="${color}"/>
    ${ticks}
  </svg>`;
}

function tradeStats(trades) {
  const sells = trades.filter(t => t.side === "sell" && t.pnl != null && t.reason !== "seeded_from_real_portfolio");
  if (!sells.length) return null;
  const wins = sells.filter(t => t.pnl > 0), losses = sells.filter(t => t.pnl <= 0);
  const sum = a => a.reduce((s, t) => s + t.pnl, 0);
  const grossWin = sum(wins), grossLoss = Math.abs(sum(losses));
  const best = sells.reduce((a, b) => a.pnl > b.pnl ? a : b);
  const worst = sells.reduce((a, b) => a.pnl < b.pnl ? a : b);
  return {
    n: sells.length, wins: wins.length, losses: losses.length,
    winRate: wins.length / sells.length * 100,
    avgWin: wins.length ? grossWin / wins.length : 0,
    avgLoss: losses.length ? -grossLoss / losses.length : 0,
    profitFactor: grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0),
    totalPnl: sum(sells), best, worst,
  };
}

// Manual close - overrides the sell rules for one paper position. Token-
// protected server-side; only ever touches the simulated book.
async function paperSell(ticker) {
  if (!confirm(`Sell paper position ${ticker} at the current market price?\n\nThis overrides the sell rules (paper book only - no real order is placed).`)) return;
  const token = await getToken();
  if (!token) return;
  try {
    const r = await fetch("/api/paper/sell", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Auth-Token": token },
      body: JSON.stringify({ ticker }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      toast(body.detail || `Sell failed (${r.status})`, "error");
      if (r.status === 403) localStorage.removeItem(AUTH_TOKEN_KEY);
      return;
    }
    toast(`${ticker} sold @ $${body.exit_price?.toFixed(2)} — P&L ${(body.pnl||0) >= 0 ? '+' : ''}$${body.pnl?.toFixed(2)} (${body.pnl_pct?.toFixed(2)}%)`, "success");
