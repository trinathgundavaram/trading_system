# §12 (Phase 2 step 2.1). Minimal on purpose.
[pytest]
testpaths = tests

markers =
    slow: takes more than a second or needs a live server. Excluded from the
        pre-commit hook, included in a full run and in release.sh.

# --strict-markers rejects an unregistered marker in a @pytest.mark DECORATOR.
# It does NOT validate `-m` expressions: `pytest -m 'not typo'` still selects
# everything and exits 0 (verified, 2026-07-25). So the pre-commit hook's
# `-m 'not slow'` is protected only by `slow` being declared above - if you add
# a marker, add it here too, because a mistyped one in a hook fails open.
addopts = --strict-markers

# The utcnow() DeprecationWarnings are real and tracked (§31 replaces every
# call site with storage/clock.py). Silenced here so they stop burying actual
# failures in 200 lines of noise - the fix is scheduled, and a warning nobody
# can see is not a warning.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
