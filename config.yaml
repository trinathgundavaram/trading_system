    enabled: true
    no_buy_below: 20
    # 2026-10-30: was 85. Closed swing patterns entered when Fear & Greed was above 55 averaged -4.8% (40% wins,
    # 83 patterns) against +1.7% (57% wins) when it was 25-55; the sign held in both halves of the history
    # (Spearman -0.22 / -0.21). Caveat: only ~10 independent entry days, dominated by one August episode,
    # so this is a risk-reduction choice, not a proven edge. Above this level NEW entries pause; exits keep running.
    no_buy_above: 60
    no_sell_below: 15
  vix:
    enabled: true
    no_trade_above: 28
    tighten_stops_above: 20
  yield_curve:
