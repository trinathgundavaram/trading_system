watchlist: []
trading:
  # Phase 0 step 0.1 (2026-07-24): all three live-execution gates closed.
  # Do not reopen these until the §32 re-arm gate passes - see CHANGELOG.md.
  auto_trade: false
  trade_size_usd: 100
  # 2026-10-30: % -of-purse sizing exists (engine/position_sizing.py::_get_equity: cash + positions) and was
  # switched on for a few hours, then switched OFF again: the swing engine's closed-pattern record is
  # profit factor 0.61 over only ~10 independent entry days and realized paper trades are net negative
  # (117 exits, PF 0.77), so scaling its size up would just scale an unproven edge. Trades stay small
  # (fixed $100 base x score tier, ~$20-100) until the evidence says otherwise. Turn it on deliberately:
  # 5% base x tier / EV / volatility multipliers => roughly $100-$500 a position.
  use_dynamic_sizing: false
  position_size_pct_of_portfolio: 5.0     # only used if use_dynamic_sizing is turned on
  max_positions: 25
  scan_interval_minutes: 15
  day_trade_scan_interval_minutes: 15
  market_open_buffer_minutes: 30
  market_close_buffer_minutes: 30
  mode: HYBRID
  watch_execute: WATCH
  live_execution_enabled: false
  cycle_max_parallel_tickers: 6
  max_cycle_duration_minutes: 12
  hard_kill_minutes: 15
  # §42.4 (Phase 3). A cycle aborts if the local clock is more than this far
  # from an HTTP Date reference. 120s is well inside any tolerance that
  # matters for market-hours and stop timing, and well outside normal NTP
  # jitter. Raise it only if you understand that every stop timestamp and
  # every market-open decision is being made against a clock you have just
  # declared untrustworthy. Docker Desktop's VM clock after a laptop sleep is
  # the case this exists for.
  max_clock_skew_seconds: 120
  day_eod_flatten_enabled: true
  day_eod_flatten_time_et: '15:55'
  # 2026-10-30 EXPERIMENT (paper only): DAY positions are held until the cutoff of the NEXT session instead
  # of being flattened the day they open. Evidence (engine's real entries replayed on daily prices, ~8 entry
  # days): next-close exit averaged +1.2% after 0.3% costs (PF 1.8, 5 of 8 days positive; DAY mode +2.6%, PF
  # 2.9, 7 of 8) vs -0.16% (PF 0.86, 3 of 8) realized; holding 3-5 sessions turns negative. In-sample, so the
  # success test is forward-looking: >= 30 entry days from 2026-10-30 with profit factor > 1.3 - see
  # scripts/swing_experiment_report.py. Set to 0 to restore the same-day flatten.
  day_hold_sessions: 1
  max_day_positions: 5
rotation:
  enabled: true
  min_candidate_score: 80.0
  max_victim_health_score: 55
  min_hold_days: 3
  max_rotations_per_week: 2
paper_trading:
  # 2026-07-26 (Akhil): raised 1000 -> 10000 to widen the paper book so it
  # places more trades and accumulates a usable sample faster. At $1,000 the
  # purse itself was the binding constraint - a $500 max_position_size_usd
  # meant two positions and the account was fully deployed, so most BUY
  # signals were skipped for insufficient cash rather than on their merits,
  # and the learning data was a sample of "whatever came first" instead of
  # "whatever scored best".
  #
  # This value only applies at SEED time - engine/paper_trader.ensure_seeded()
  # returns early if the purse row already exists. The existing account was
  # topped up in place (scripts/topup_paper_account.py) so the ledger, the
  # equity curve and the open simulated positions survived; this line is what
  # a future reset/reseed will use.
  starting_cash: 10000
  price_watch:
    enabled: true
    interval_seconds: 30
rsi2_sleeve:
  # RSI(2)/Connors-style SPY mean-reversion sleeve (2026-08-02) - a
  # SEPARATE strategy from the swing engine above, with its own dedicated
  # cash ledger (storage/database.py's rsi2_account, not paper_account) so
  # it never competes with swing for the same purse. See docs/beating_the_
  # market_analysis_2026-07-28.md sec 11-12 for the validated backtest and
  # sec 12's blend analysis this sizing was framed around (Trinath named a
  # 20-40% equity-allocation range as an illustrative example, not a final
  # number). rsi_threshold/exit_mode are deliberately NOT configurable here
  # - they are frozen constants in rules/rsi2_spy_swing.py per Trinath's own
  # explicit instruction not to keep tuning the validated rule set.
  paper_enabled: false  # explicit opt-in required - false until Trinath turns this on
  # $3,000 = 30% of paper_trading.starting_cash above (the midpoint of
  # Trinath's own 20-40% illustrative range) - a PROPOSED default, not a
  # confirmed final figure. Only applies at seed time, same convention as
  # paper_trading.starting_cash above (engine/rsi2_paper_trader.ensure_
  # seeded() returns early once the account row exists).
  paper_starting_cash: 3000
  # Live trading is NOT wired yet (2026-08-02) - intentionally left out of
  # this file until (a) Trinath gives a concrete real-dollar figure (not an
  # illustrative range) and (b) a dedicated RSI2 validation-receipt gate
  # exists, mirroring run_backtest.py's existing one for swing rather than
  # riding on it. See the live-trading task in this session's plan.
sector_momentum_sleeve:
  # PAPER only. strategy "blend" = 50% sector momentum + 50% broad 3/6/12m
  # composite (top 8 of 22 ETFs), all T-bills (SHY) when SPY < its 200d SMA,
  # risk positions x `leverage` (rules/sector_momentum.py::target_weights_blend).
  # Research 2007-2026 at 2.0x with the 2% band: ~17.8% CAGR / ~-36% max
  # drawdown (worst year ~-10%) vs SPY
  # 12.3% / -47%; borrowed cash is charged financing_bps. "sector" = the
  # unlevered top-3 sector version.
  paper_enabled: true
  strategy: blend
  leverage: 2.0
  financing_bps: 400.0
  band_pct: 2.0        # SPY 200d rule hysteresis: on above SMA*1.02, off below SMA*0.98
  paper_starting_cash: 10000
  top_n: 3
  cost_bps: 5.0
stock_momentum_sleeve:
  # PAPER only. Top N S&P 500 stocks by 3/6/12-month momentum, equal weight,
  # monthly; T-bills (SHY) when SPY is risk-off (same 200d rule + band as the
  # ETF sleeve). rules/stock_momentum.py. Research (point-in-time membership,
  # only ~63% price coverage so optimistic): ~11.7% CAGR / ~-21% drawdown at
  # 1.0x, ~13.5% / ~-27% at 1.25x (now); ~8% at 50 bps costs. Universe: data/sp500_membership.csv (refresh it
  # quarterly - see data/README.md).
  paper_enabled: true
  paper_starting_cash: 10000
  top_n: 40
  leverage: 1.25
  band_pct: 2.0
  cost_bps: 5.0
  financing_bps: 400.0
  min_trade_frac: 0.002   # ignore rebalance trims/adds smaller than 0.2% of equity (a 40-name book needs a small floor)
tradingagents_advisor:
  # TauricResearch/TradingAgents as an ADVISORY rating logger (never trades).
  # Needs a local install of the repo and ANTHROPIC_API_KEY in the environment.
  # Judge it with scripts/tradingagents_report.py before letting it influence
  # anything. Each ticker-day is a multi-agent LLM run - keep the cap low.
  enabled: false
  max_tickers_per_day: 5
  extra_tickers: []
  deep_model: claude-opus-5-5
  quick_model: claude-sonnet-5-5
  max_debate_rounds: 1
screener:
  enabled: true
  refresh_minutes: 15
  max_candidates: 30
  exploration_slots: 3
  research_score_vetoed: true
  dynamic_by_regime: true
  discovery_max_parallel: 8
  quality_gate:
    enabled: true
    min_price: 10.0
    max_price: 1000.0
    min_avg_volume: 1000000
    max_parallel: 10
  sources:
    rs_gainers:
      enabled: true
    volume_surge:
      enabled: true
    gap_candidates:
      enabled: true
    pre_market_movers:
      enabled: true
    sector_leaders:
      # DISABLED 2026-10-28: yfinance_get_top now returns industries with company NAMES
      # (no ticker symbols), so this source yielded 0 candidates while spending ~80s
      # (11 sequential MCP calls) of every scan cycle. Re-enable only after the parser in
      # engine/screener.py::_screen_sector_leaders maps names to tickers.
      enabled: false
      top_n_per_sector: 3
    universe_sweep:
      enabled: true
      batch_per_cycle: 10
    alpha_movers:
      enabled: true
    fq_movers:
      enabled: true
    momentum_screen:
      enabled: false
    finviz_screen:
      enabled: false
    insider_buying:
      enabled: false
  learning:
    exclude_unhealthy_tickers: true
    unhealthy_min_consecutive: 3
    unhealthy_recheck_cooldown_minutes: 30
    exclude_low_quality_tickers: true
    min_track_record: 12
    max_qualify_rate_to_exclude: 0.05
    min_stale_block_rate_to_exclude: 0.5
risk_level: TURBO
risk:
  # §8 (Phase 2): the TIGHTER of these two binds.
  #
  # max_daily_loss_usd was $500 against a $1,000 paper account - a limit that
  # only triggers after losing half the account is a number, not a limit. The
  # percentage resolves against the book's actual equity, so it scales with
  # the account instead of being re-guessed every time the account changes.
  # On $1,000 that is a $20 daily stop; against the observed -$15.25 over four
  # days it would have halted the session on day one.
  max_daily_loss_pct: 2.0
  max_daily_loss_usd: 500

  # §11 (Phase 2): drawdown caps. Realised P&L cannot see either of these -
  # an account can round-trip 4% intraday and finish flat, having taken every
  # bit of that risk, and max_daily_loss would never have noticed.
  #
  # Measured against the equity curve for the book being traded
  # (daily_stats.paper_max_drawdown / paper_running_drawdown, written by
  # storage/database.update_drawdown on every equity point).
  #
  # 2.0, set from the MEASUREMENT rather than from an argument.
  #
  # This was 3.0 on the reasoning that intraday excursion runs wider than the
  # realised figure, so the cap should sit above the 2.0% daily-loss
  # percentage. Then scripts/backfill_drawdown.py was run against the real
  # curve - 371 equity points over 8 local days - and reported:
  #
  #     median intraday drawdown  0.17%
  #     worst                     1.25%   (2026-07-16)
  #
  # 3.0% therefore had never bound and would not have halted anything. That
  # is the precise failure §18 is about: a limit that is never measured and
  # never fires is documentation, not risk management.
  #
  # 2.0 is ~1.6x the worst day observed. Above it, so a normal session is
  # untouched; close enough that an abnormal one is actually caught.
  #
  # PROVISIONAL, and honestly so. Eight days of a barely-trading account is
  # not a distribution, and the sample includes days whose equity curve was
  # disturbed by the 2026-07-25 account re-seed. Re-run the backfill after ~20
  # real sessions and set this from the wider sample; expect to RAISE it as
  # position sizes grow, since a $100 entry cannot move a $1,000 book far.
  max_intraday_drawdown_pct: 2.0     # halt for the day
  # 15% from the all-time high is not a bad day, it is the strategy having
  # stopped working. Halts entirely; clearing it is a human act, same as the
  # kill switch, because the one thing an automatic breaker must never do is
  # re-arm itself overnight.
  #
  # UNVALIDATED, unlike the intraday figure above. The account has never been
  # more than ~1.6% off its peak, so there is no observed distribution to set
  # this from - 15% is a judgement about how much of the book you are willing
  # to lose before a human looks, not a measurement.
  #
  # The peak it measures against is scoped to the CURRENT paper-account epoch
  # (storage/database._paper_epoch_start). Before that scoping existed, the
  # 2026-07-25 re-seed - which stepped the curve from ~984 to 1491.54 - made
  # the re-seed the all-time high, so every later day read a ~34% running
  # drawdown and this cap would have tripped the kill switch on the next
  # cycle for an accounting event.
  max_running_drawdown_pct: 15.0     # halt entirely, human review required

  # 2026-07-26 (Akhil): both raised alongside the $1,000 -> $10,000 paper
  # account. Left alone they would simply have become the new binding
  # constraint and the extra capital would have sat idle: 10 trades/day at
  # $500 can deploy $5,000 of a $10,000 book, so half the account could never
  # be put to work in a single session.
  #
  # 30/day is a throughput number for data collection, NOT a claim that 30
  # trades a day is a good strategy. It is deliberately generous because this
  # is the PAPER book and the point is sample size. Revisit before EXECUTE.
  # Note this is a per-day cap only - the real spend limiter is still
  # risk.max_daily_loss_pct (2.0%), which now resolves to ~$200/day against
  # $10,000 rather than ~$20, and max_positions (25).
  max_trades_per_day: 30
  # $1,000/position against a $10,000 book = 10 full-size positions, so the
  # 25-position max_positions cap stays reachable and diversification is not
  # traded away for size.
  max_position_size_usd: 1000
  max_portfolio_risk_pct: 5.0
  min_confidence: 75
  # The manual halt. Set true (or let trip_kill_switch_if_needed set it) to
  # stop all trading; clearing it is a deliberate human act - edit and restart.
  kill_switch_triggered: false
  # daily_loss_limit_triggered / daily_profit_lock_triggered REMOVED (§54,
  # Phase 2.5). Nothing in the codebase ever wrote them, while three readers
  # treated them as live controls - one of which (position_management.py) used
  # daily_loss_limit_triggered as a priority-1 exit-everything trigger. The
  # daily-loss control that is real lives in rules/risk_rules.py and trips
  # kill_switch_triggered above.
  CONSERVATIVE:
    buy_score_threshold_pct: 68
    buy_score_threshold_day_pct: 73
    rsi_oversold_threshold: 35
    stochastic_threshold: 20
    vix_entry_max: 22
    fg_min: 25
    fg_max: 80
    macro_blackout: all
    stop_loss_swing_pct: 4
    stop_loss_day_pct: 2
  MODERATE:
    buy_score_threshold_pct: 60
    buy_score_threshold_day_pct: 65
    rsi_oversold_threshold: 40
    stochastic_threshold: 25
    vix_entry_max: 25
    fg_min: 20
    fg_max: 85
    macro_blackout: fomc_nfp
    stop_loss_swing_pct: 5
    stop_loss_day_pct: 2.5
  AGGRESSIVE:
    buy_score_threshold_pct: 55
    buy_score_threshold_day_pct: 60
    rsi_oversold_threshold: 45
    stochastic_threshold: 30
    vix_entry_max: 26
    fg_min: 15
    fg_max: 90
    macro_blackout: fomc
    stop_loss_swing_pct: 7
    stop_loss_day_pct: 3.5
  TURBO:
    buy_score_threshold_pct: 50
    buy_score_threshold_day_pct: 55
    rsi_oversold_threshold: 45
    stochastic_threshold: 30
    vix_entry_max: 27
    fg_min: 10
    fg_max: 95
    macro_blackout: fomc
    stop_loss_swing_pct: 8
    # 2026-10-30: was 4 (now 7; kept below the 8% swing cap). Median ATR of the entries is 4.4% (DAY 5.2%): a 4% cap sat inside
    # ordinary daily noise and the ATR-derived stop never got room to work.
    stop_loss_day_pct: 7
stop_machine:
  DAY:
    atr_multiplier_strong: 1.0
    atr_multiplier_standard: 0.8
    atr_multiplier_weak: 0.6
    breakeven_r: 0.3
    breakeven_lock_r: 0.05
    profit_protect_r: 0.8
    profit_protect_lock_r: 0.2
    profit_protect_trail_atr_mult: 0.75
    trend_trail_r: 1.5
    trend_trail_atr_mult: 0.75
  SWING:
    atr_multiplier_strong: 2.0
    atr_multiplier_standard: 1.5
    atr_multiplier_weak: 1.2
    breakeven_r: 0.5
    breakeven_lock_r: 0.05
    profit_protect_r: 1.0
    profit_protect_lock_r: 0.25
    profit_protect_trail_atr_mult: 1.5
    trend_trail_r: 2.0
    trend_trail_atr_mult: 1.5
  atr_spike:
    atr_pct_threshold: 5.0
    multiplier_bonus: 0.4
position_sizing:
  enabled: true
  score_tiers:
  - min_score: 85
    size_pct: 100
  - min_score: 75
    size_pct: 70
  - min_score: 65
    size_pct: 40
  - min_score: 0
    size_pct: 25
  ev_confidence_multiplier:
    insufficient: 0.5
    low: 0.7
    moderate: 0.9
    high: 1.0
  volatility_atr_pct_bands:
  - max_atr_pct: 2.0
    multiplier: 1.0
  - max_atr_pct: 4.0
    multiplier: 0.85
  - max_atr_pct: 6.0
    multiplier: 0.65
  - max_atr_pct: 999.0
    multiplier: 0.45
  min_size_pct: 20
  max_size_pct: 100
  day_size_multiplier: 0.5
portfolio_risk:
  enabled: true
  max_sector_exposure_pct: 35
  max_theme_exposure_pct: 40
  max_portfolio_beta: 1.6
  correlation_lookback_days: 60
  high_correlation_threshold: 0.75
  max_high_correlation_cluster: 3
  # PROVISIONAL, and unlike the drawdown caps above this one has never been
  # measured at all - 5.0 is a round number chosen because it sounded like
  # "high volatility", not a percentile of anything. Recorded here 2026-07-26
  # so it stops reading as a derived figure.
  #
  # WHY IT CANNOT BE MEASURED YET. The open-position side of this check has
  # been falling back to a PROXY where a stored ATR was unavailable, and
  # engine/portfolio_risk.py counts those in `high_vol_proxy_count` precisely
  # so the substitution is visible rather than assumed away (see its comment at
  # the field, and §B6). While that count is non-zero, the population this
  # threshold would be fitted against is part real ATR and part proxy, and a
  # percentile over a mixed population describes neither.
  #
  # WHEN TO RECALIBRATE. Once `high_vol_proxy_count` has been zero or
  # near-zero across ~20 sessions, take the distribution of real ATR-as-%-of-
  # price across open positions and set this to the percentile you actually
  # want to call "high volatility" - then replace this comment with the
  # measured value, the percentile it represents, and the sample size, exactly
  # as max_intraday_drawdown_pct records its own provenance above. Expect the
  # measured figure to differ: 5% of price is a large daily range for a liquid
  # large-cap and an ordinary one for the momentum names the screener favours,
  # so a single number chosen a priori is likely wrong in one direction or the
  # other for most of the book.
  high_vol_atr_pct_threshold: 5.0
  # Also provisional, and for the same reason - a cap of 4 on a book that
  # rarely holds more than a handful of positions has probably never bound.
  # rejected_signals will show whether it ever did before you tune it.
  max_simultaneous_high_vol_positions: 4

  # §18 (Phase 2). Was false, which meant a breach only scaled position size -
  # so sector 35%, theme 40%, beta 1.6 and the correlation cluster limit were
  # all documentation. Turned on NOW, while still in paper mode, so you can
  # see how often it fires before it ever costs a real trade.
  #
  # With 244 BUY signals in eight days from momentum-based discovery,
  # correlated clustering is the default state rather than the exception. If
  # this blocks constantly, that is the finding, not a misconfiguration: it
  # means the screener is producing a single correlated bet dressed up as a
  # diversified book. Read rejected_signals to see what it declined.
  hard_block_on_severe_breach: true

  # How far past a cap counts as SEVERE rather than merely over. At 1.5 a 35%
  # sector cap warns and sizes down from 35%, and refuses the entry at 52.5%.
  # A single multiple applies to every dimension deliberately - a per-cap
  # tolerance is four more numbers to justify, and there is no evidence yet
  # that would justify them differently.
  severe_breach_multiple: 1.5

  # UNCLASSIFIED is its own bucket with its own tighter cap. A position no
  # source can categorise is an unmeasured risk, and unmeasured risk should be
  # rationed rather than allowed to accumulate under the same allowance as a
  # risk you can actually see. This binds immediately: none of the names
  # actually traded (ADPT, FLYW, ERAS, XRAY, PSNL, VG, HLN, TAK) appear in the
  # theme_map below, so before §18 derived sector/industry buckets they were
  # ALL unclassified and none of them counted toward anything.
  max_unclassified_exposure_pct: 25

  # A share-of-book measure needs a book. The first trade of the day is 100%
  # of one sector, 100% of one theme and 100% unclassified simultaneously, so
  # without this floor the concentration checks would refuse the opening
  # entries of every session for arithmetic reasons rather than risk ones.
  # Below the floor those dimensions still SIZE DOWN - they just cannot
  # refuse. Beta and correlation are deliberately not gated by it: neither is
  # a share of the book, so both mean something on the very first position.
  min_positions_for_concentration_block: 3

  theme_map:
    AI:
    - NVDA
    - MSFT
    - GOOGL
    - AMZN
    - AMD
    - META
    SEMICONDUCTORS:
    - NVDA
    - AMD
    MEGA_CAP_TECH:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    EV_AUTO:
    - TSLA
market_filters:
