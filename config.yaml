learning:
  # ── Phase 1 step 1.4 (§17, 2026-07-24): the learning loop is FROZEN ──────
  # The gate was open on 23 closed patterns, every one produced under the
  # stop bug removed 2026-07-20. Nothing had moved yet only because
  # require_shadow_validation was true and bayesian_weight_history happened
  # to be empty - that is luck holding, not a control.
  bayesian_learning_rate: 0.01
  bayesian_max_change_per_trade_pct: 3
  bayesian_weekly_max_total_pct: 10
  bayesian_monthly_max_total_pct: 25

  # Raised 10 -> 150. Six weighted buckets and ~60 rules cannot be fitted
  # from 23 observations - the parameter space exceeds the sample, so any
  # weight movement is noise fitted to a defect. 150 is the floor at which a
  # 5pp shift in a bucket weight is distinguishable from sampling error at
  # this win rate.
  min_trades_before_bayesian: 150

  # HARD gate, independent of the count. Weights stay frozen until the
  # scoring recalibration (§19, Phase 4) lands AND a clean sample exists - a
  # large sample of contaminated trades is worse than a small one, because it
  # looks trustworthy. Flipping this to true is a decision-function change:
  # it requires a minor/major version bump and a release note (§35/§36).
  bayesian_enabled: false

  # Only patterns recorded at or after this timestamp may train anything.
  # Everything earlier was produced under the stop bug removed 2026-07-20.
  # Applies to the LEARNING path only - the EV engine's pattern matching is
  # deliberately left alone in Phase 1, because filtering it would change
  # live scoring and this release is decision_function_changed: false. §15
  # (Phase 2) extends the filter to every learning read.
  min_pattern_recorded_at: '2026-07-25T00:00:00'

  loss_streak_halt: 5
  walk_forward_trigger_trades: 10
  walk_forward_trigger_days: 7
  threshold_regret_trigger_days: 7
  pattern_db_lambda_swing: 0.7
  pattern_db_lambda_day: 1.4
  champion_challenger_min_trades_for_significance: 30
  pattern_hold_days: 5
  require_shadow_validation: true    # never turn this off (§17)
backtest:
  enabled: true
  weekly_trigger_days: 7
  # months 12 -> 24 -> 36 (2026-07-24, zero-trades follow-up): 12 months over
  # the mega-cap list produced a 0-trade run (closest miss ASTS, 4.4pt
  # deficit). 24 months + the screener_discovered auto universe (see
  # ticker_source below) narrowed the closest miss to 2.33pt (MARA,
  # 2024-12-05, 47.67% vs a 50.0% threshold) and pushed pct_scoring_ge_40 up
  # to 5.3% - real movement, not noise, but still 0 trades. Extending to 36
  # months gives ~1.5x more candidate-days and a wider spread of regimes to
  # actually clear the bar at least once, without changing anything about
  # the scoring/veto logic itself - this is more sampling, not another fix.
  months: 36
  warmup_days: 260
  max_hold_days: 20
  # execution_cost_bps (2026-07-28, Trinath's directive #2 after reviewing
  # the 2542-trade/PF-1.14 run: "add execution costs now... the current edge
  # is not large enough to ignore friction"). Round-trip slippage+spread
  # haircut in basis points, split evenly across entry and exit fills - see
  # engine/execution_costs.py's module docstring for the model and for the
  # post-hoc sensitivity table that motivated this (PF 1.14 at 0bps -> 1.05
  # at 20bps -> 1.01 at 30bps -> 0.93 at 50bps on that run). Default 0 (OFF)
  # so this cannot silently change any existing/automatic run's numbers -
  # set explicitly here, or pass run_backtest.py --execution-cost-bps, to
  # activate. 20-30 is a reasonable "realistic friction" starting point for
  # a swing-traded, not-mega-cap-only universe; raise it for a more
  # conservative/less liquid assumption.
  execution_cost_bps: 0
  # entry_filter (2026-07-28, Trinath's directive #3: "test a stricter
  # regime gate or a 'BULL-only/high-conviction only' subset"). BACKTEST-
  # ONLY research knob - rules/swing_buy_rules.py and every live/paper path
  # are completely unaware of this key, see engine/backtest_engine.py's
  # passes_entry_filter() docstring. A candidate that clears the real
  # threshold but fails this filter is skipped exactly like a sub-threshold
  # score (the replay's i-pointer advances to the next candidate), which is
  # what makes a filtered run's numbers a real end-to-end test rather than a
  # post-hoc slice of an unfiltered run's trades.
  #
  # The 2026-07-28 review found min_tier: standard + exclude_regimes: [BULL]
  # held up far better under execution costs than the unfiltered set (PF
  # 1.28 vs 1.02 @ 25bps on a fresh 60-ticker run, n=375) - both fields
  # default to "off" here so that result has to be deliberately re-enabled,
  # not silently baked into every future run.
  entry_filter:
    min_tier:               # null (off) | weak | standard | strong
    exclude_regimes: []     # e.g. [BULL] - values are engine/regime_engine.py's regime labels
    # max_vix (2026-07-28, from docs/beating_the_market_analysis_2026-07-28.md
    # §2.4): the 5-year lookback found 2022 - a real bear market - was this
    # filter's worst year by far (PF 0.53), and exclude_regimes: [BULL] does
    # nothing to protect against it. VIX is only one of five weighted votes
    # into dominant_regime, so a direct threshold here catches elevated
    # volatility even when the regime vote still lands BULL/CHOPPY. null=off.
    max_vix:                 # e.g. 25 - candidate-days with vix_close above this are rejected
    # max_realized_vol_pct (2026-07-28, same-day follow-up to max_vix above):
    # exclude_regimes: [BEAR] + max_vix: 25 STILL failed to protect 2022 -
    # every one of that year's surviving trades in that test was labeled
    # CHOPPY, zero BEAR, because engine/regime_engine.py's dominant_regime
    # vote hardcodes Fear&Greed and Advance/Decline ratio to neutral in
    # Stage 1 (no free historical source exists for either), structurally
    # padding the CHOPPY vote regardless of real conditions. This threshold
    # is computed DIRECTLY from SPY price data (trailing annualized realized
    # volatility - see engine/backtest_engine.py's realized_vol_pct()) and
    # never touches dominant_regime or the fake F&G/AD-ratio inputs at all,
    # so it cannot inherit that bias. Roughly VIX-scale but NOT the same
    # thing - realized (already-happened) vol, not implied (forward-looking)
    # vol. null=off.
    max_realized_vol_pct:        # e.g. 25 - candidate-days above this trailing realized vol are rejected
    # min_spy_trend_pct (2026-07-28, same-day follow-up #2): max_realized_vol_pct
    # ALSO failed to protect 2022 - it removed some 2022 candidates but the
    # REMAINING ones got worse (PF 0.24, not better), because 2022's losses
    # aren't concentrated in high-volatility days. Three independent same-day
    # signals (regime label, VIX, realized vol) have all failed the same way -
    # this is deliberately NOT a fourth same-day threshold. It's SPY's price
    # as a % above/below its own 200-day SMA (engine/backtest_engine.py's
    # spy_trend_pct()) - a slow-moving, multi-month read meant to catch a
    # SUSTAINED downtrend the other three structurally cannot. null=off;
    # 0 means "only trade with SPY at/above its 200-day SMA" (a classic
    # systematic trend filter); negative values (e.g. -5) allow some cushion
    # below the SMA before rejecting.
    min_spy_trend_pct:
  # ticker_source (2026-07-24, "pick tickers automatically instead of a
  # hand-curated list, will that help or create noise"): "screener_discovered"
  # means the tickers list below is IGNORED and engine/backtest_loop.py's
  # resolve_backtest_tickers() instead pulls up to max_auto_tickers names
  # from the live screener_candidates table, ordered by how often the real
  # discovery sources (rs_gainers/volume_surge/sector_leaders/etc.) found
  # them worth surfacing. Deliberately NOT "tickers that cleared 50%+
  # historically" - selecting a backtest universe by an outcome measured
  # over the SAME window being backtested is look-ahead/selection bias: with
  # ~600+ tickers in screener_candidates, some will clear 50%+ in-sample by
  # chance alone even with zero real edge, and a list curated that way would
  # trivially "pass" this backtest without that meaning anything. Ordering by
  # discovery frequency instead is knowable without knowing the outcome, so
  # it's a legitimate universe rather than a curated winner list. Falls back
  # to the static `tickers` list below if screener_candidates is empty/
  # unreachable (e.g. a fresh install with no screener history yet) - set
  # ticker_source back to "static" to always use the explicit list below
  # instead (e.g. for a controlled, reproducible comparison run).
  ticker_source: screener_discovered
  max_auto_tickers: 60
  # tickers: STATIC FALLBACK ONLY while ticker_source is screener_discovered
  # above (used only if the DB is unreachable or screener_candidates is
  # empty). The original 13 are mega-cap tech/growth names that structurally
  # sit near their SMAs and rarely swing far enough to clear TURBO's
  # threshold - confirmed via output/trading.db's real live `signals` table,
  # where these same 13 cleared 50%+ on well under 2% of scored candidates.
  # The 12 added on 2026-07-24 (HLN/USB/HOMB/NVO/ENOV/HBAN/TAK/WFC/JEF/KEY/
  # PBR-A/MO) were a manually-curated "these cleared 50%+ live" list - kept
  # here only as the static fallback, superseded by ticker_source above for
  # normal runs since that manual curation has the same look-ahead-bias
  # problem described above, just picked by hand instead of by code.
  tickers:
  - VRT
  - ORCL
  - MU
  - FIX
  - ASTS
  - NFLX
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - HLN
  - USB
  - HOMB
  - NVO
  - ENOV
  - HBAN
  - TAK
  - WFC
  - JEF
  - KEY
  - PBR-A
  - MO
# The `ui:` section is gone entirely (v1.2.0), key included - a bare `ui:` with
# only comments under it parses as None, and `cfg.get("ui", {})` then returns
# None rather than {}, which crashes on the next .get(). An absent key is
# safer than an empty one.
#
# auth_token REMOVED from this file (v1.2.0).
#
# Phase 0 step 0.2 turned a literal token into ${UI_AUTH_TOKEN}. §4 then
# moved the ACTUAL lookup to storage/secrets.py, so nothing has read
# cfg["ui"]["auth_token"] since - server.py calls secrets.get() directly.
#
# Leaving the reference here was actively harmful: config_loader raises on a
# missing ${VAR}, by design, so the whole platform refused to start if the
# token lived only in the macOS Keychain and not in .env. A dead config key
# was holding startup hostage to a secret no code path consumed.
#
# Set the token with:
#   python3 -c 'import secrets; print(secrets.token_urlsafe(32))' | \
#     xargs -I{} security add-generic-password -a $USER -s tp_UI_AUTH_TOKEN -w {} -U
# storage/secrets.py resolves environment -> .env -> Keychain.
# Notifications (§43.3, Phase 3). Transports are tried IN THIS ORDER until one
# succeeds. `log` is last and always succeeds, so a notification is never
# silently lost - the pre-Phase-3 code dropped it with a warning when
# osascript failed, which on a headless box or inside a container was always.
#
# On a container-only or headless install, put webhook first and drop desktop:
# the desktop attempt cannot work there and only costs a subprocess spawn.
notifications:
  enabled: true
  desktop_enabled: true
  transports: [desktop, webhook, log]
  # Any endpoint that accepts a POST: https://ntfy.sh/your-topic, a Slack or
  # Discord incoming webhook, Pushover. This is the transport that reaches you
  # when you are not at the machine, and the only one that works from inside a
  # container - which under §47 is where the engine runs. Resolved from the
  # environment so the URL is not committed.
  # `:-` default is required, not stylistic: config_loader hard-fails on an
  # unset ${VAR} with no fallback, and a webhook is genuinely optional.
  webhook_url: ${NOTIFY_WEBHOOK_URL:-}
  high_conviction_buy_pct: 80
